<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoApply</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("aa.theme") || "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<style>
:root {
  --bg: #f5f6fa; --panel: #ffffff; --ink: #151821; --muted: #646d7c; --line: #e4e7ee; --accent: #5b4bf5; --accent-soft: #eeecff; --accent-ink: #fff;
  --good: #14804a; --good-soft: #e5f6ec; --warn: #9a5b00; --warn-soft: #fff3e0; --bad: #c0261c; --bad-soft: #fdecea; --chip: #f0f2f6;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.06); --radius: 14px;
}
/* Light by default (like Tsenta); dark when chosen in the sidebar, or "System" on a dark system */
:root[data-theme="dark"] { --bg: #0e1015; --panel: #171a21; --ink: #e9ecf2; --muted: #9aa3b2; --line: #272c36; --accent: #8b7dff; --accent-soft: #252244; --chip: #20242d;
  --good: #4cd08d; --good-soft: #15291f; --warn: #f2b45a; --warn-soft: #2d2414; --bad: #ff7b70; --bad-soft: #301a19; --shadow: none; color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] { --bg: #0e1015; --panel: #171a21; --ink: #e9ecf2; --muted: #9aa3b2; --line: #272c36; --accent: #8b7dff; --accent-soft: #252244; --chip: #20242d;
    --good: #4cd08d; --good-soft: #15291f; --warn: #f2b45a; --warn-soft: #2d2414; --bad: #ff7b70; --bad-soft: #301a19; --shadow: none; color-scheme: dark; }
}
:root:not([data-theme]), :root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 18px; letter-spacing: -.02em; padding: 2px 6px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #b05bf5); color: #fff; display: grid; place-items: center; font-size: 15px; }
.me { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }

/* drop-down lists follow the app's theme (otherwise Windows draws them white with the page's light text) */
select option, select optgroup { background: var(--panel); color: var(--ink); }
.me small { color: var(--muted); display: block; }
nav { display: grid; gap: 2px; }
nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 9px 10px; border-radius: 10px; cursor: pointer; font: inherit; }
nav button:hover { background: var(--chip); }

nav .ic { width: 18px; text-align: center; }

nav button.on .n { background: var(--panel); color: var(--accent); }
.side-foot { margin-top: auto; display: grid; gap: 8px; }
.ai { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; } .dot.on { background: var(--good); }
main { padding: 28px 40px 140px; width: 100%; min-width: 0; } /* full width on desktop, like Tsenta (no narrow column) */
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; }
h2 { font-size: 16px; margin: 0 0 4px; }

.sub { color: var(--muted); margin: 0 0 20px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card + .card, .section + .section { margin-top: 14px; }
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 24px; letter-spacing: -.02em; }
.stat span { color: var(--muted); font-size: 12.5px; }
button.btn, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 550; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }

.btn.primary:hover { filter: brightness(1.08); }

input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

label.f { display: grid; gap: 5px; font-size: 13px; }

.form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.form .wide { grid-column: 1 / -1; }
.pw { position: relative; display: flex; }
.pw input { padding-right: 42px; }
.pw .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; padding: 6px 8px; color: var(--muted); border-radius: 8px; }
.pw .eye:hover { background: var(--chip); color: var(--ink); }
/* permission toggles */
.perm { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); }
.perm:first-of-type { border-top: 0; padding-top: 4px; }
.perm .txt { flex: 1; } .perm .txt b { display: block; font-weight: 600; } .perm .txt small { color: var(--muted); }
.aimode { flex: 1 1 180px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 600; } .aimode small { display: block; font-weight: 400; color: var(--muted); margin-top: 3px; font-size: 12px; } .aimode.on { border-color: var(--accent); background: var(--accent-soft); }
.switch { position: relative; width: 42px; height: 24px; flex: none; margin-top: 2px; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font: inherit; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
/* job cards */
.jobs { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.job:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.ring { --p: 0; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c, var(--good)) calc(var(--p) * 1%), var(--chip) 0); }
.ring b { width: 42px; height: 42px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-size: 13px; }
.job .title { font-weight: 650; cursor: pointer; } .job .title:hover { color: var(--accent); }
.job .meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.job .acts { display: flex; gap: 6px; align-items: center; }
.job select { width: auto; padding: 5px 8px; font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; background: var(--chip); color: var(--muted); font-weight: 550; }
.chip.submitted { background: var(--good-soft); color: var(--good); }
.chip.failed, .chip.needs_input { background: var(--bad-soft); color: var(--bad); }
.chip.filled, .chip.skipped, .chip.running { background: var(--warn-soft); color: var(--warn); }
.chip.matched { background: var(--accent-soft); color: var(--accent); }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--chip); }
tr:last-child td { border-bottom: 0; }
td.t { font-weight: 600; cursor: pointer; } td.t:hover { color: var(--accent); }
.muted { color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: center; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 18px; background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--accent); }

.empty { text-align: center; padding: 48px 20px; color: var(--muted); }

.drawer-bg { position: fixed; inset: 0; background: rgba(10,12,18,.35); z-index: 19; }
.drawer { position: fixed; top: 0; right: 0; width: min(640px, 100%); height: 100vh; background: var(--panel); border-left: 1px solid var(--line); padding: 22px; overflow: auto; z-index: 20; }
.drawer h2 { margin-top: 18px; }
.drawer pre { white-space: pre-wrap; font: 13px/1.55 system-ui, sans-serif; background: var(--chip); padding: 12px; border-radius: 10px; max-height: 360px; overflow: auto; }
.drawer img { width: 100%; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; }
.qa { display: grid; gap: 6px; }
.qa div { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,18,.45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border-radius: 18px; padding: 22px; width: min(460px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal .row { margin-top: 16px; justify-content: flex-end; }
.taskpanel { position: fixed; bottom: 16px; right: 16px; width: min(480px, calc(100% - 32px)); z-index: 30; }
.taskpanel .card { padding: 14px 16px; box-shadow: 0 10px 30px rgba(16,24,40,.18); }
.progress { height: 4px; background: var(--chip); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.progress i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 4px; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
details.log summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.log { font: 12px/1.45 ui-monospace, Consolas, monospace; background: var(--chip); border-radius: 10px; padding: 8px; max-height: 200px; overflow: auto; white-space: pre-wrap; margin: 6px 0; }
.prompt { border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 12px; margin-top: 10px; display: grid; gap: 8px; }
.toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; }
.toast { background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-weight: 550; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.err { background: var(--bad); color: #fff; }
.kv { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; align-items: start; margin-bottom: 8px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.feedgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
.feedhead { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; } .feedhead .views { display: flex; gap: 22px; }
.feedhead .views button { border: 0; background: none; font: inherit; font-size: 30px; font-weight: 700; color: var(--muted); opacity: .55; cursor: pointer; padding: 0; letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; }
.feedhead .views button.on { color: var(--ink); opacity: 1; } .feedhead .badge { font-size: 12px; background: var(--ink); color: var(--panel); border-radius: 999px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 6px; }
.chipbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 24px; padding: 8px 8px 8px 12px; background: var(--panel); box-sizing: border-box; width: 100%; overflow: hidden; } /* rounded corners that still hold several rows of chips */
.chipbox:focus-within { border-color: var(--accent); }
.tchip { max-width: 100%; } .tchip > :first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chipbox input { flex: 1; min-width: 180px; border: 0; background: none; outline: none; padding: 6px; } .chipbox .btn { border-radius: 999px; }
.tchip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; } .tchip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.fchip { position: relative; } .fchip > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; background: var(--panel); user-select: none; } .fchip > summary::-webkit-details-marker { display: none; }
.fchip.on > summary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.fchip .pop { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: grid; gap: 6px; }
.fchip .pop > button { text-align: left; border: 0; background: none; color: var(--ink); padding: 6px 8px; border-radius: 8px; cursor: pointer; font: inherit; } .fchip .pop > button:hover, .fchip .pop > button.on { background: var(--chip); }
.cpick { display: flex; gap: 6px; align-items: center; padding: 3px 2px; font-size: 13px; } .cpick input { width: auto; }
.jlist { display: grid; } .jrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.jrow:hover { background: var(--chip); } .jmain { cursor: pointer; min-width: 0; } .jt { font-weight: 600; font-size: 15.5px; } .jm { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.clogo { width: 36px; height: 36px; border-radius: 10px; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.ibtn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-size: 15px; } .ibtn.send:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.fside { position: sticky; top: 16px; display: grid; gap: 14px; min-width: 0; } .sbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.shead { display: flex; gap: 8px; align-items: center; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; margin-bottom: 8px; } .shead a { margin-left: auto; }
.logos { display: flex; flex-wrap: wrap; gap: 6px; } .logos .clogo { width: 30px; height: 30px; font-size: 11px; border-radius: 999px; }
.sitem > span:last-child { white-space: nowrap; font-size: 11.5px; }
.sbox { min-width: 0; overflow: hidden; }
.sitem { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; min-width: 0; gap: 8px; align-items: center; padding: 6px 0; cursor: pointer; font-size: 12.5px; } .sitem .clogo { width: 30px; height: 30px; font-size: 11px; } .sitem b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; } .sitem .warn { color: var(--warn); }
a.l { color: var(--accent); cursor: pointer; text-decoration: none; }
@media (max-width: 900px) { .feedgrid { grid-template-columns: 1fr; } .fside { position: static; } }
.feedmain { min-width: 0; position: relative; padding-bottom: 60px; }
#feedList { transition: opacity .15s ease; } #feedList.loading { opacity: .45; pointer-events: none; }
.fchip .pop > button .tick { float: right; color: var(--good); }
.fchip .pop.msel { width: 300px; max-width: 90vw; padding: 0; gap: 0; overflow: hidden; }
.msel .mhead { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 12px 14px 6px; }
.msel .msearch { margin: 2px 12px 8px; width: calc(100% - 24px); }

.headicons { display: flex; align-items: center; gap: 10px; } .hicon { position: relative; width: 36px; height: 36px; border-radius: 999px; border: 0; background: none; color: var(--ink); font-size: 18px; cursor: pointer; } .hicon:hover { background: var(--chip); }

.avatar.sm { width: 34px; height: 34px; font-size: 12px; background: #1f3d34; color: #fff; }
.searchrow { display: flex; gap: 10px; align-items: flex-start; } .searchrow .chipbox { flex: 1; }

<body>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// Served by this computer: same origin, signed in with a cookie. Served by GitHub Pages: config.json says where the
// server is (its Cloudflare address) and the session token travels in an Authorization header.
const HOSTED = /\.github\.io$/.test(location.hostname) || !!document.querySelector('meta[name="autoapply-hosted"]'); // the offline test page sets this
let API = "";
const authHeader = () => { const t = HOSTED && store.get("aa.token"); return t ? { authorization: `Bearer ${t}` } : {}; };
async function api(path, opts = {}) {
  if (OFF) return offApi(path, opts);
  let res;
  try { res = await fetch(`${API}/api${path}`, { ...opts, headers: { "content-type": "application/json", "x-autoapply": "1", ...authHeader(), ...(opts.headers ?? {}) }, body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body }); }
  catch { throw Object.assign(new Error("AutoApply is offline — the computer that runs it is off or not online right now."), { offline: true }); }
  const data = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (res.status === 401 && !path.startsWith("/auth/")) { showLogin(); throw new Error("Please sign in."); }
  if (res.status === 403 && data?.error === "pending") { showPending(); throw new Error("Waiting for approval."); }
  if (!res.ok) throw new Error(data?.error ?? res.statusText);
  return data;
}

// ---------------- offline mode ----------------
// When the AutoApply computer is off, the GitHub page signs in to Supabase and shows the copy that computer saved
// there (refreshed every few minutes while it's on). Things people do are saved as waiting actions; the computer
// carries them out, as the person who asked, when it's back on. Passwords and owner settings never go this way.
let OFF = null;
const SB = { cfg: null };
const OFF_QUEUE = [["PUT", /^\/(search|profile|answers|learned)$/], ["POST", /^\/jobs\/[^/]+\/(save|status|stage)$/], ["POST", /^\/inbox$/], ["POST", /^\/tasks$/], ["POST", /^\/resumes\/[^/]+\/default$/]];
const offErr = () => Object.assign(new Error("This needs the AutoApply computer to be on. Try again when it's back."), { offline: true });
const sbSession = () => { try { return JSON.parse(store.get("aa.sb") || "null"); } catch { return null; } };
async function sbAuth(grant, body) {
  const r = await fetch(`${SB.cfg.url}/auth/v1/token?grant_type=${grant}`, { method: "POST", headers: { apikey: SB.cfg.anonKey, "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(/invalid/i.test(d.error_description ?? d.msg ?? "") ? "Wrong email or password." : d.error_description || d.msg || "Couldn't sign in.");
  store.set("aa.sb", JSON.stringify({ access: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in ?? 3600) * 1000 - 60e3, email: d.user?.email }));
  return d;
}
async function sbToken() {
  const s = sbSession(); if (!s?.access) return null;
  if (Date.now() < s.exp) return s.access;
  try { await sbAuth("refresh_token", { refresh_token: s.refresh }); return sbSession().access; } catch { store.set("aa.sb", ""); return null; }
}
async function sb(method, q, body) {
  const t = await sbToken();
  if (!t) { showLogin(); throw new Error("Please sign in."); }
  const r = await fetch(`${SB.cfg.url}/rest/v1/${q}`, { method, headers: { apikey: SB.cfg.anonKey, authorization: `Bearer ${t}`, "content-type": "application/json", prefer: "return=minimal" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { store.set("aa.sb", ""); showLogin(); throw new Error("Please sign in."); }
  if (!r.ok) throw new Error(`Offline copy: ${(await r.text()).slice(0, 160)}`);
  return r.status === 204 || r.status === 201 ? null : r.json();
}
async function goOffline() {
  if (!(await sbToken())) return showLogin();
  const [rows, status, pending] = await Promise.all([
    sb("GET", "autoapply_mirror?select=workspace,key,data,updated_at"),
    sb("GET", "autoapply_status?select=last_seen").catch(() => []),
    sb("GET", "autoapply_queue?select=id,workspace,method,path&status=eq.pending&order=id.asc").catch(() => []),
  ]);
  const data = {}; let copiedAt = 0;
  for (const r of rows ?? []) { (data[r.workspace] ??= {})[r.key] = r.data; copiedAt = Math.max(copiedAt, Date.parse(r.updated_at) || 0); }
  OFF = { data, lastSeen: status?.[0]?.last_seen ?? null, copiedAt, pending: pending ?? [], email: sbSession()?.email ?? "" };
  OFF.users = Object.keys(data).filter((id) => data[id].summary).map((id) => data[id].meta ?? { id, name: id });
  S.me = { email: OFF.email, name: OFF.email, role: "member", workspaces: OFF.users.map((u) => u.id), offline: true };
  $("#login")?.remove();
  await loadUsers(); await render(); offBanner();
  // check every minute whether the computer is back
  setInterval(async () => {
    if (!API || $("#offBack")) return;
    const up = await fetch(`${API}/api/auth/state`, { headers: authHeader(), signal: AbortSignal.timeout(8000) }).then((r) => r.ok).catch(() => false);
    if (up) $("#offbar").innerHTML = `<span>✅</span><div><b>AutoApply's computer is back on.</b></div><button class="btn sm primary" id="offBack" onclick="location.reload()">Refresh</button>`;
  }, 60e3);
}
function offBanner() {
  let el = $("#offbar");
  if (!el) { el = document.createElement("div"); el.id = "offbar"; document.body.prepend(el); }
  const n = OFF.pending.length;
  el.innerHTML = `<span>📴</span><div><b>AutoApply's computer is off${OFF.lastSeen ? ` (last on ${esc(agoText(OFF.lastSeen))})` : ""}.</b> You're seeing the copy from ${OFF.copiedAt ? esc(agoText(new Date(OFF.copiedAt).toISOString())) : "earlier"}. Anything you do is saved and happens when it's back on.${n ? ` <b>${n} waiting.</b>` : ""}</div>`;
}
const offBody = (b) => (typeof b === "string" ? JSON.parse(b || "{}") : b ?? {});
const offJobs = (D) => [D["feed:all"]?.rows ?? [], D["feed:saved"]?.rows ?? [], D["jobs:open"] ?? [], D["jobs:applications"] ?? []];
function offFind(D, id) { for (const list of offJobs(D)) { const j = list.find((x) => x.id === id); if (j) return j; } return null; }
function offPatchJob(D, id, patch) { let hit = null; for (const list of offJobs(D)) for (const j of list) if (j.id === id) { Object.assign(j, patch); hit = j; } return hit; }
// The same filters as the server's job feed, run on the saved copy.
function offFeed(D, q) {
  const all = D["feed:all"] ?? { rows: [], companies: [], countries: [], side: {} };
  const qa = (k) => (q.get(k) ?? "").split(",").map((s) => s.trim()).filter(Boolean), lc = (s) => String(s ?? "").toLowerCase();
  const days = +q.get("days") || 0, min = +q.get("min") || 0, maxexp = +q.get("maxexp") || 0, pay = +q.get("pay") || 0, work = q.get("workplace") || "", degree = q.get("degree") || "";
  const locs = qa("loc"), cos = qa("companies").map(lc), excl = qa("exclude").map(lc), emp = qa("emp");
  const when = (j) => Date.parse(j.postedAt ?? 0) || 0, deg = ["bachelor", "master", "phd"];
  const fits = (j) => (q.get("all") === "1" || j.autoApply)
    && (!days || Date.now() - when(j) <= days * 864e5) && (!min || (j.score ?? 0) >= min)
    && (!locs.length || (j.places ?? []).some((p) => locs.includes(p)))
    && (!work || (work === "remote" ? /remote/i.test(j.location ?? "") : work === "hybrid" ? /hybrid/i.test(`${j.location} ${j.remote ?? ""}`) : !/remote|hybrid/i.test(`${j.location} ${j.remote ?? ""}`)))
    && (!cos.length || cos.includes(lc(j.company))) && !excl.some((x) => `${lc(j.title)} ${lc(j.company)} ${lc(j.location)}`.includes(x))
    && (!maxexp || j.facts?.years == null || j.facts.years <= maxexp) && !(q.get("visa") === "1" && j.facts?.noSponsorship) && !(q.get("noclear") === "1" && j.facts?.clearance)
    && (!emp.length || emp.includes(j.employment)) && (!pay || j.facts?.payMax == null || j.facts.payMax >= pay)
    && (!degree || !j.facts?.degree || deg.indexOf(j.facts.degree) <= deg.indexOf(degree));
  const minScore = D.summary?.search?.minScore ?? 80, forYou = (j) => (j.score ?? 0) >= minScore;
  const open = all.rows.filter((j) => !["submitted", "rejected", "discovered", "skipped", "queued"].includes(j.status));
  const base = open.filter(fits), saved = (D["feed:saved"]?.rows ?? []).filter((j) => j.saved && j.status !== "submitted");
  const view = q.get("view") || "all";
  const rows = view === "saved" ? saved.filter(fits) : view === "foryou" ? base.filter(forYou) : base;
  rows.sort((a, b) => (q.get("sort") === "newest" ? when(b) - when(a) || (b.score ?? 0) - (a.score ?? 0) : (b.score ?? 0) - (a.score ?? 0) || when(b) - when(a)));
  const sr = D.summary?.search ?? {}; // search terms as the server works them out (match.js searchTerms)
  const terms = [...new Set([...(sr.keywords ?? []), ...(sr.strictTitles ? [] : sr.titleInclude ?? [])].map((x) => String(x).trim()).filter(Boolean))];
  return { ...all, terms, view, total: rows.length, rows: rows.slice(0, 300), counts: { all: base.length, foryou: base.filter(forYou).length, saved: saved.length } };
}
async function offApi(path, opts) {
  const method = (opts.method ?? "GET").toUpperCase();
  const [p, qs] = path.split("?"), q = new URLSearchParams(qs ?? "");
  const m = p.match(/^\/users\/([^/]+)(\/.*)?$/), ws = m && decodeURIComponent(m[1]), rel = m?.[2] ?? "", D = ws ? OFF.data[ws] : null;
  if (method === "GET") {
    if (p === "/auth/state") return { account: S.me, supabase: null };
    if (p === "/users") return OFF.users;
    if (p === "/settings") return { backend: null, offline: true };
    if (p === "/tasks") return [];
    if (!D) throw offErr();
    if (!rel) return D.summary;
    if (rel === "/feed") return offFeed(D, q);
    if (rel === "/jobs") return D[`jobs:${q.get("status")}`] ?? [];
    const jm = rel.match(/^\/jobs\/([^/]+)$/);
    if (jm) { const j = offFind(D, decodeURIComponent(jm[1])); if (!j) throw offErr(); return { ...j, receipts: [] }; }
    if (rel === "/readiness") return { ready: true, missing: [], blockers: [] }; // checked again when the computer runs it
    if (D[rel.slice(1)] !== undefined) return D[rel.slice(1)];
    throw offErr();
  }
  if (!D || !OFF_QUEUE.some(([mm, re]) => mm === method && re.test(rel))) throw offErr();
  const body = offBody(opts.body);
  await sb("POST", "autoapply_queue", { workspace: ws, method, path: p, body });
  OFF.pending.push({ workspace: ws, method, path: p });
  // show the change straight away
  const jm = rel.match(/^\/jobs\/([^/]+)\/(\w+)$/), id = jm && decodeURIComponent(jm[1]);
  let out = { ok: true, queued: true, requeued: [] };
  if (/^\/(search|profile|answers)$/.test(rel)) { D.summary[rel.slice(1)] = body; out = D.summary; }
  else if (jm?.[2] === "save") { const j = offPatchJob(D, id, { saved: !!body.saved }); const sv = (D["feed:saved"] ??= { rows: [] }); sv.rows = sv.rows.filter((x) => x.id !== id); if (body.saved && j) sv.rows.push(j); out = j ?? out; }
  else if (jm) out = offPatchJob(D, id, jm[2] === "stage" ? { stage: body.stage } : { status: body.status }) ?? out;
  else if (rel === "/inbox") D.inbox = (D.inbox ?? []).filter((it) => it.key !== body.key);
  else if (rel === "/tasks") {
    const side = ((D["feed:all"] ??= { rows: [], side: {} }).side ??= {});
    for (const jid of body.jobIds ?? []) { const j = offPatchJob(D, jid, { status: "queued" }); if (j) (side.inProgress ??= []).unshift({ id: j.id, company: j.company, title: j.title, status: "waiting for computer" }); }
    out = { id: "queued", status: "queued" };
  }
  offBanner();
  setTimeout(() => toast(rel === "/tasks" ? "Saved. AutoApply will apply as soon as its computer is back on." : "Saved. It happens when AutoApply's computer is back on."), 400);
  return out;
}

// On GitHub Pages, links and images that point at /api/… (PDFs, screenshots, CSV) are loaded from the server with the
// sign-in token, then shown from memory.
async function apiBlob(href) {
  const r = await fetch(API + href, { headers: authHeader() });
  if (!r.ok) throw new Error(`Couldn't open the file (${r.status})`);
  return URL.createObjectURL(await r.blob());
}
if (HOSTED) {
  document.addEventListener("click", async (e) => {
    const a = e.target.closest('a[href^="/api/"]'); if (!a) return;
    e.preventDefault();
    try { const u = await apiBlob(a.getAttribute("href")); const x = Object.assign(document.createElement("a"), { href: u, target: "_blank", rel: "noopener" }); if (a.hasAttribute("download") || /format=csv/.test(a.href)) x.download = "saved-answers.csv"; x.click(); } catch (err) { fail(err); }
  }, true);
  new MutationObserver(() => document.querySelectorAll('img[src^="/api/"]').forEach(async (img) => {
    const src = img.getAttribute("src"); img.removeAttribute("src");
    try { img.src = await apiBlob(src); } catch {}
  })).observe(document.documentElement, { childList: true, subtree: true });
}

const S = { users: [], userId: store.get("aa.user"), user: null, tab: store.get("aa.tab") || "jobs", tasks: [], settings: null };
const ALL_TABS = [["jobs", "🎯", "Jobs"], ["applications", "📋", "Applications"], ["resumes", "📄", "Resumes"], ["profile", "👤", "Profile"], ["preferences", "⚙️", "Job preferences"], ["questions", "📥", "Needs you"], ["settings", "🔑", "AI & settings"], ["team", "👪", "Family & access", "admin"], ["online", "🌐", "Online access", "admin"]];
let TABS = ALL_TABS.filter((t) => !t[3]);
const isAdmin = () => ["owner", "admin"].includes(S.me?.role);
const U = () => `/users/${encodeURIComponent(S.userId)}`;
const STATUS = { matched: "Ready to apply", submitted: "Applied", needs_input: "Needs your input", failed: "Didn't go through", filled: "Preview ready", skipped: "Skipped", discovered: "New", rejected: "Not a match" };
const statusChip = (s) => `<span class="chip ${esc(s)}">${esc(STATUS[s] ?? s)}</span>`;

function toast(msg, err) {
  const el = document.createElement("div"); el.className = `toast ${err ? "err" : ""}`; el.textContent = msg;
  $("#toasts").append(el); setTimeout(() => el.remove(), err ? 6000 : 3000);
}
const fail = (e) => toast(e.message ?? String(e), true);

function modal({ title, body, ok = "OK", cancel = "Cancel" }) {
  return new Promise((resolve) => {
    $("#modal").innerHTML = `<div class="modal-bg"><div class="modal"><h2>${title}</h2><div class="muted" style="margin-top:6px">${body}</div>
      <div class="row">${cancel ? `<button class="btn" data-m="0">${cancel}</button>` : ""}<button class="btn primary" data-m="1">${ok}</button></div></div></div>`;
    $("#modal").querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { $("#modal").innerHTML = ""; resolve(b.dataset.m === "1"); });
  });
}

// password field with an eye toggle; `reveal` loads a saved value the first time it is shown
function pwField(id, placeholder, reveal) {
  return `<div class="pw"><input id="${id}" type="password" autocomplete="new-password" placeholder="${esc(placeholder)}">
    <button type="button" class="eye" data-eye="${id}" title="Show / hide" aria-label="Show or hide">👁</button></div>`;
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-eye]"); if (!b) return;
  const inp = document.getElementById(b.dataset.eye);
  if (inp.type === "password") {
    if (!inp.value && inp.dataset.reveal === "ats") {
      try { inp.value = (await api(`${U()}/secrets`)).atsPassword; } catch (err) { return fail(err); }
    }
    inp.type = "text"; b.textContent = "🙈";
  } else { inp.type = "password"; b.textContent = "👁"; }
});

// ---------------- shell ----------------
async function loadUsers() {
  S.users = await api("/users");
  if (!S.users.find((u) => u.id === S.userId)) S.userId = S.users[0]?.id ?? null;
  $("#userSel").innerHTML = S.users.map((u) => `<option value="${esc(u.id)}" ${u.id === S.userId ? "selected" : ""}>${esc(u.name)}</option>`).join("") || `<option>No one yet</option>`;
  if (S.userId) { store.set("aa.user", S.userId); S.user = await api(U()); } else S.user = null;
  S.settings = await api("/settings").catch(() => null);
  const be = S.settings?.backend;
  $("#aiDot").classList.toggle("on", !!be);
  $("#llm").textContent = be === "subscription" ? "Claude AI · your subscription" : be === "api" ? "Claude AI · API key" : "Claude AI off — connect it";
  const p = S.user?.profile;
  $("#avatar").textContent = p ? `${(p.firstName ?? "?")[0] ?? ""}${(p.lastName ?? "")[0] ?? ""}`.toUpperCase() : "?";
  TABS = ALL_TABS.filter((t) => !t[3] || isAdmin());
  if (!TABS.some(([id]) => id === S.tab)) S.tab = "jobs";
  $("#acct").innerHTML = S.me ? `<span>👤</span><b title="${esc(S.me.email)}">${esc(S.me.name || S.me.email)}</b><a id="signOut">Sign out</a>` : "";
  renderClaudeSwitch();
}

// Quick Claude switch for the person being applied for: Off / Ask first / Automatic (same as Profile → Permissions).
function renderClaudeSwitch() {
  const m = S.user?.search?.aiMode;
  $("#claudeSw").innerHTML = S.user ? `<span class="muted">Use Claude (subscription)</span><div class="seg">${[["off", "Off"], ["ask", "Ask first"], ["auto", "Auto"]].map(([k, l]) => `<button data-aimode="${k}" class="${m === k ? "on" : ""}">${l}</button>`).join("")}</div>` : "";
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-aimode]"); if (b) {
    try { S.user = await api(`${U()}/search`, { method: "PUT", body: { ...S.user.search, aiMode: b.dataset.aimode } }); renderClaudeSwitch(); toast({ off: "Claude is off — no tokens are used", ask: "Claude only when you allow it", auto: "Claude may be used automatically" }[b.dataset.aimode]); if (S.tab === "profile") render(); } catch (err) { fail(err); }
  }
  if (e.target.id === "signOut") { await api("/auth/logout", { method: "POST", body: {} }).catch(() => {}); store.set("aa.token", ""); store.set("aa.sb", ""); location.reload(); }
});

function renderNav() {
  const st = S.user?.stats ?? {};
  const counts = { jobs: S.feedCount ?? (st.matched ?? 0) + (st.needs_input ?? 0) + (st.failed ?? 0) + (st.filled ?? 0) + (st.skipped ?? 0), applications: st.submitted, resumes: S.user?.resumes.length, questions: S.user?.unansweredCount };
  $("#nav").innerHTML = TABS.map(([id, ic, name]) => `<button data-tab="${id}" class="${S.tab === id ? "on" : ""}"><span class="ic">${ic}</span>${name}${counts[id] ? `<span class="n">${counts[id]}</span>` : ""}</button>`).join("");
}

// Offline mode needs each person's password once (it creates their sign-in for when this computer is off).
function offlineSetupBanner() {
  if (!S.offlineAvail || !S.me || S.me.offline || OFF) return "";
  return `<div class="banner" id="offSetup" style="background:var(--accent-soft, #eef2ff);color:inherit"><div>📴</div><div style="flex:1"><b>Use AutoApply even when this computer is off.</b> Confirm your password once to turn it on.
    <form class="row" style="margin-top:8px;gap:8px" onsubmit="event.preventDefault();offlineConfirm()"><input id="offPw" type="password" autocomplete="current-password" placeholder="Your AutoApply password" style="max-width:260px"><button class="btn sm primary">Turn on</button></form></div></div>`;
}
async function offlineConfirm() {
  const pw = $("#offPw").value; if (!pw) return toast("Type your password", true);
  try {
    await api("/me/offline", { method: "POST", body: { password: pw } });
    if (HOSTED && SB.cfg) await sbAuth("password", { email: S.me.email, password: pw }).catch(() => {});
    S.me.offline = true; $("#offSetup")?.remove(); toast("Done. You can use AutoApply here even when the computer is off.");
  } catch (e) { fail(e); }
}
window.offlineConfirm = offlineConfirm;
function setupBanner() {
  const probs = [...(S.user.problems ?? [])];
  if (!S.settings?.backend) probs.push("Claude AI not connected — sign in with your Claude subscription in AI & settings (AI answers for open questions are off)");
  if (!probs.length) return "";
  return `<div class="banner"><div>⚠️</div><div><b>Finish setup to let AutoApply apply for ${esc(S.user.profile.firstName)}</b><ul>${probs.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div></div>`;
}

async function render() {
  renderNav();
  const m = $("#main");
  if (!S.user && !["settings", "team", "online"].includes(S.tab)) { m.innerHTML = `<div class="card empty"><div class="big">👋</div><h1>Welcome to AutoApply</h1><p>Add the first person to apply for.</p><button class="btn primary" onclick="newUser()">＋ Add a person</button></div>`; return; }
  m.innerHTML = offlineSetupBanner() + (S.user ? setupBanner() : "") + `<div id="view"></div>`;
  await VIEWS[S.tab]($("#view")).catch(fail);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { if (S.tab !== t.dataset.tab) { S.filter = structuredClone(EMPTY_FILTER); S.cmdReply = ""; } S.tab = t.dataset.tab; store.set("aa.tab", S.tab); closeDrawer(); render(); }
});
$("#userSel").addEventListener("change", async (e) => { S.userId = e.target.value; await loadUsers(); closeDrawer(); render(); pollTasks(); });
$("#newUserBtn").addEventListener("click", () => newUser());

// Onboarding: upload a resume, AutoApply reads everything it shows and uses safe defaults for routine questions
// (how you heard → LinkedIn, notice → two weeks, demographic questions → decline). It asks only what an application
// needs and nothing else can answer — usually just whether the person may work in their country.
async function newUser() {
  const box = (inner) => { $("#modal").innerHTML = `<div class="modal-bg"><div class="modal" style="width:min(600px,100%)">${inner}</div></div>`; };
  box(`<h2>Add a person</h2><p class="muted">Upload their resume. AutoApply reads their details from it, so there's almost nothing to fill in.</p>
    <label class="drop" id="obDrop"><input id="obPdf" type="file" accept="application/pdf" hidden><div style="font-size:30px">📄</div><b>Choose the resume PDF</b><small class="muted">or drop it here</small></label>
    <div class="row"><a class="l muted" id="obManual">No resume yet? Enter a name instead</a><span class="spacer"></span><button class="btn" id="obCancel">Cancel</button></div>`);
  $("#obCancel").onclick = () => { $("#modal").innerHTML = ""; };
  $("#obManual").onclick = () => newUserManual();
  const drop = $("#obDrop");
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
  $("#obPdf").onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
  async function upload(file) {
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return toast("Please choose a PDF file", true);
    drop.innerHTML = `<div class="spin"></div><b>Reading the resume…</b>`;
    const pdfBase64 = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.readAsDataURL(file); });
    let u;
    try { u = await api("/users", { method: "POST", body: { pdfBase64 } }); } catch (err) { fail(err); return newUser(); }
    S.userId = u.id; store.set("aa.user", u.id); await loadUsers();
    questions(u.onboarding ?? { found: [], questions: [], titles: [] });
  }
  function questions(ob) {
    const qs = ob.questions;
    box(`<h2>${qs.length ? `Almost done: ${qs.length === 1 ? "one question" : `${qs.length} quick questions`}` : "All set"}</h2>
      ${ob.found.length ? `<p class="muted" style="margin-bottom:6px">From the resume:</p><div class="found">${ob.found.map((f) => `<span>✓ ${esc(f)}</span>`).join("")}</div>` : ""}
      ${ob.readable === false ? `<div class="banner" style="margin-top:12px"><div>ℹ️</div><div>This PDF has little readable text (maybe a scan), so a few more details are needed. It's still the file employers will get.</div></div>` : ""}
      ${qs.length ? `<div class="form" id="obForm" style="grid-template-columns:1fr;margin-top:14px">${qs.map((q) => inputFor([q.key, q.label, q.type])).join("")}</div>` : ""}
      <label class="f" style="margin-top:14px"><span>Jobs to look for</span><input id="obTitles" value="${esc(ob.titles.join(", "))}" placeholder="e.g. Business Analyst, Project Coordinator"><small>Comma separated. Matched anywhere in the job title or description.</small></label>
      <p class="muted" style="font-size:12.5px;margin-top:10px">Routine questions are answered for you: how you heard about the job (LinkedIn), notice period (two weeks), salary (open to discussing), and "prefer not to say" for demographic questions. You can change any of them in Profile.</p>
      <div class="row"><span class="spacer"></span><button class="btn primary" id="obGo">Start finding jobs</button></div>`);
    $("#obGo").onclick = async () => {
      const form = $("#obForm");
      if (form) {
        const body = collect(form, S.user.profile);
        const left = qs.filter((q) => { const v = q.key.split(".").reduce((x, k) => x?.[k], body); return v == null || v === ""; });
        if (left.length) return toast(`Please answer: ${left.map((q) => q.label).join(" · ")}`, true);
        try { S.user = await api(`${U()}/profile`, { method: "PUT", body }); } catch (e) { return fail(e); }
      }
      const titles = $("#obTitles").value.split(",").map((s) => s.trim()).filter(Boolean);
      try { S.user = await api(`${U()}/search`, { method: "PUT", body: { ...S.user.search, keywords: titles } }); } catch (e) { return fail(e); }
      $("#modal").innerHTML = ""; S.tab = "jobs"; store.set("aa.tab", "jobs"); await loadUsers(); render();
      toast(`Welcome, ${S.user.profile.firstName || "there"}! Looking for jobs now…`);
      startTask({ type: "discover" });
    };
  }
}
window.newUser = newUser;
async function newUserManual() {
  $("#modal").innerHTML = `<div class="modal-bg"><div class="modal"><h2>Add a person</h2><p class="muted">AutoApply keeps a separate profile, resumes and applications for each person.</p>
    <div class="form" style="grid-template-columns:1fr 1fr"><label class="f"><span>First name</span><input id="nuF"></label><label class="f"><span>Last name</span><input id="nuL"></label>
    <label class="f wide"><span>Email</span><input id="nuE" type="email"></label></div>
    <div class="row"><button class="btn" id="nuC">Cancel</button><button class="btn primary" id="nuOk">Create</button></div></div></div>`;
  $("#nuC").onclick = () => { $("#modal").innerHTML = ""; };
  $("#nuOk").onclick = async () => {
    if (!$("#nuF").value.trim()) return toast("Add a first name", true);
    try { const u = await api("/users", { method: "POST", body: { firstName: $("#nuF").value.trim(), lastName: $("#nuL").value.trim(), email: $("#nuE").value.trim() } }); $("#modal").innerHTML = ""; S.userId = u.id; S.tab = "resumes"; await loadUsers(); render(); toast("Person added — upload a resume next"); }
    catch (err) { fail(err); }
  };
}
window.newUser = newUser;

// ---------------- tasks ----------------
async function startTask(body) {
  try { await api(`${U()}/tasks`, { method: "POST", body }); pollTasks(true); }
  catch (err) { fail(err); }
}
let pollTimer = null;
async function pollTasks(force) {
  clearTimeout(pollTimer);
  if (!S.userId) return;
  const tasks = await api(`/tasks?user=${encodeURIComponent(S.userId)}`).catch(() => []);
  const running = tasks.find((t) => t.status === "running");
  const latest = running ?? tasks[0];
  const wasRunning = S.tasks.some((t) => t.status === "running");
  S.tasks = tasks;
  renderTask(latest, !!running || force);
  if (wasRunning && !running) { await loadUsers(); render(); }
  if (running) pollTimer = setTimeout(pollTasks, 1200);
}
let taskHidden = false;
// What happened to each job in a run, and exactly what is still needed for the ones that stopped.
function fixButton(text) {
  if (/password/i.test(text)) return `<button class="btn sm" data-tab="profile">Set password</button>`;
  if (/claude|ai /i.test(text) && /sign|connect/i.test(text)) return `<button class="btn sm" data-tab="settings">Connect Claude</button>`;
  if (/profile|address|postal|phone|email/i.test(text)) return `<button class="btn sm" data-tab="profile">Open profile</button>`;
  return "";
}
function outcomeList(items) {
  if (!items?.length) return "";
  return `<div style="display:grid;gap:8px;margin-top:10px;max-height:260px;overflow:auto">${items.map((it) => {
    const needs = [...(it.missing ?? [])];
    const why = it.error ?? it.note ?? "";
    const pwHost = it.status !== "submitted" ? it.passwordHost : null;
    const fix = pwHost ? "" : fixButton([...needs, why].join(" "));
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px">
      ${pwHost ? `<div style="font-size:12.5px;margin:4px 0">You already have an account at <b>${esc(pwHost.split(".")[0])}</b> with your own password. Type it once — AutoApply signs in with it from now on.</div>
        <div class="row">${pwField(`sitepw-${it.id}`, `Your ${pwHost.split(".")[0]} password`)}<button class="btn sm primary" data-sitepw="${esc(it.id)}" data-host="${esc(pwHost)}">Save & try again</button></div>` : ""}
      <div class="row"><b style="flex:1;min-width:0">${esc(it.title ?? "")}<span class="muted" style="font-weight:400"> · ${esc(it.company ?? "")}</span></b>${statusChip(it.status)}</div>
      ${it.status !== "submitted" && (needs.length || why) ? `<div style="font-size:12.5px;margin-top:4px">${needs.length ? `<b>Needs:</b><ul style="margin:2px 0 0;padding-left:18px">${needs.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}${why && !needs.length ? esc(why) : why && needs.length ? `<div class="muted">${esc(why)}</div>` : ""}</div>` : ""}
      <div class="row" style="margin-top:6px">${fix}${it.id ? `<button class="btn sm ghost" onclick="openJob('${esc(it.id)}')">Details</button>` : ""}${it.status !== "submitted" && it.id ? `<button class="btn sm ghost" data-act="apply" data-id="${esc(it.id)}">Try again</button>` : ""}</div></div>`;
  }).join("")}</div>`;
}
function lastLine(t) { return [...t.log].reverse().find((l) => l.trim()) ?? ""; }
function renderTask(t, show) {
  const el = $("#taskpanel");
  if (!t || (taskHidden && !show)) { el.innerHTML = ""; el.dataset.sig = ""; return; }
  if (show) taskHidden = false;
  const p = t.prompt;
  let promptHtml = "";
  if (p) {
    const info = p.info ?? {};
    if (info.kind === "review") {
      promptHtml = `<div class="prompt"><b>Ready to submit — take a look?</b><div class="muted">${esc(info.summary ?? "")}</div>
        ${info.missing?.length ? `<div style="color:var(--bad)">Still required: ${info.missing.map(esc).join("; ")}</div>` : ""}
        <div class="muted">The filled application is open in the browser window. Change anything you like there, then:</div>
        <div class="row"><button class="btn primary" data-resp="s">Submit application</button><button class="btn" data-resp="k">Skip this job</button><button class="btn ghost" data-resp="q">Stop</button></div></div>`;
    } else if (info.kind === "resume") {
      promptHtml = `<div class="prompt"><b>Use the resume tailored for this job?</b>
        <ul style="margin:0;padding-left:18px">${(info.changes ?? []).map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
        <a target="_blank" href="/api${U()}/receipts/${encodeURIComponent(info.receiptId)}/${encodeURIComponent(info.pdf)}">Preview tailored PDF ↗</a>
        <div class="row"><button class="btn primary" data-resp="y">Use tailored resume</button><button class="btn" data-resp="n">Use my original</button></div></div>`;
    } else if (info.kind === "password") {
      promptHtml = `<div class="prompt"><b>🔐 You already have an account at ${esc((info.host ?? "this site").split(".")[0])}</b>
        <div>${info.rejected ? `The password saved for <b>${esc(info.host ?? "")}</b> didn't work. Type the right one.` : `An account for <b>${esc(info.email ?? "")}</b> already exists at <b>${esc(info.host ?? "")}</b> with your own password. Type it once — AutoApply remembers it and signs in by itself from now on.`}</div>
        ${pwField("taskPw", "Your password on this site")}
        <div class="row"><button class="btn primary" id="taskPwSave">Save & continue</button><button class="btn" data-resp="k">Skip this job</button></div></div>`;
    } else if (info.kind === "questions") {
      const qs = info.questions ?? [];
      const input = (q) => {
        const id = `qa-${q.id}`;
        if (q.options?.length) {
          const multi = /checkbox-group|multi/.test(q.kind);
          if (multi) return `<div class="qopts">${q.options.map((o, i) => `<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" style="width:auto" name="${id}" value="${esc(o)}">${esc(o)}</label>`).join("")}</div>`;
          return `<select id="${id}"><option value="">Choose…</option>${q.options.map((o) => `<option>${esc(o)}</option>`).join("")}</select>`;
        }
        if (q.kind === "checkbox") return `<select id="${id}"><option value="">Choose…</option><option value="true">Yes, tick it</option><option value="false">No</option></select>`;
        if (q.kind === "date") return `<input id="${id}" placeholder="MM/YYYY or MM/DD/YYYY">`;
        return q.kind === "textarea" ? `<textarea id="${id}" rows="3"></textarea>` : `<input id="${id}">`;
      };
      promptHtml = `<div class="prompt"><b>❓ ${qs.length} new question${qs.length > 1 ? "s" : ""} — ${esc(info.job ?? "")}</b>
        <div class="muted" style="font-size:12.5px">AutoApply hasn't seen ${qs.length > 1 ? "these" : "this"} before. Your answer${qs.length > 1 ? "s are" : " is"} remembered, so you won't be asked again.</div>
        <div style="display:grid;gap:10px;max-height:300px;overflow:auto">${qs.map((q) => `<label class="f" style="display:grid;gap:4px"><span style="font-size:13px">${esc(q.label)}</span>${input(q)}</label>`).join("")}</div>
        <div class="row"><button class="btn primary" id="qaSave">Save & continue</button>
          ${info.aiMode === "ask" ? `<button class="btn" id="qaClaude" ${info.claudeReady ? "" : "disabled title=\"Connect Claude in AI & settings first\""}>✨ Ask Claude (uses subscription)</button>` : ""}
          <button class="btn ghost" data-resp="k">Skip this job</button></div></div>`;
    } else if (info.kind === "click") {
      promptHtml = `<div class="prompt"><b>👆 One click needed: "${esc(info.button)}"</b>
        <div>${esc((info.host ?? "").split(".")[0])}'s Workday only accepts this button from a person. Your email and password are already filled in — switch to the browser window and click <b>${esc(info.button)}</b>. That's all: AutoApply finishes and submits the application by itself.</div>
        <div class="row"><button class="btn ghost" data-resp="k">Skip this job</button></div></div>`;
    } else if (info.kind === "verify") {
      promptHtml = `<div class="prompt"><b>✉️ Verify your email</b><div>${esc(info.host ?? "The job site")} sent a verification email to <b>${esc(info.email ?? "")}</b>. Open it and click the link, then continue.</div>
        <div class="row"><button class="btn primary" data-resp="">I've verified — continue</button><button class="btn" data-resp="k">Skip this job</button></div></div>`;
    } else {
      promptHtml = `<div class="prompt"><b>${esc(p.question)}</b>${info.messages?.length ? `<div class="muted">${info.messages.map(esc).join("<br>")}</div>` : ""}
        <div class="row"><button class="btn primary" data-resp="">Continue</button><button class="btn" data-resp="k">Skip</button></div></div>`;
    }
  }
  const running = t.status === "running";
  const html = `<div class="card"><div class="row"><b>${running ? "⏳" : t.status === "failed" ? "⚠️" : "✅"} ${esc(t.label)}</b><span class="spacer"></span>
    ${running ? `<button class="btn sm danger" id="stopTask">Stop</button>` : `<button class="btn sm ghost" id="hideTask">✕</button>`}</div>
    ${running && !p ? `<div class="progress"><i></i></div><div class="muted" style="font-size:13px">${esc(lastLine(t))}</div>` : ""}
    ${["discover", "addjob", "autopilot"].includes(t.type) && t.result?.message ? `<div style="margin-top:6px"><b>${esc(t.result.message)}</b>${t.result.newMatches ? `<div class="row" style="margin-top:6px"><button class="btn sm primary" data-jobstab-open="open">See new matches</button></div>` : ""}${t.result.rejected ? `<div class="muted" style="font-size:12.5px;margin-top:4px">Jobs that don't fit your preferences aren't listed — type in the search box to look through them too.</div>` : ""}</div>` : ""}
    ${t.result?.counts ? `<div class="muted" style="margin-top:6px">${esc(Object.entries(t.result.counts).map(([k, n]) => `${n} ${STATUS[k] ?? k}`).join(" · ") || t.result.message || "Nothing to do")}</div>` : ""}
    ${outcomeList(t.result?.items ?? (t.result?.status ? [t.result] : []))}
    ${t.status === "failed" && t.error ? `<div style="color:var(--bad);margin-top:6px">${esc(t.error)}</div>` : ""}
    ${promptHtml}
    <details class="log" ${running ? "" : ""}><summary>Activity log</summary><div class="log" id="tasklog">${esc(t.log.slice(-80).join("\n"))}</div></details>
    <div class="row">${t.result?.pdf ? `<a class="btn sm" target="_blank" href="/api${U()}/receipts/${encodeURIComponent(t.result.jobId)}/${encodeURIComponent(t.result.pdf)}">Open tailored resume ↗</a>` : ""}
    ${t.result?.receiptDir ? `<button class="btn sm" onclick="openJob('${esc(t.result.id)}')">View application details</button>` : ""}</div></div>`;
  // The panel refreshes every second while a run is going. Never redraw what hasn't changed, and when it has,
  // keep whatever the user is typing (password boxes, etc.), where the cursor is, and whether the log is open.
  const sig = `${t.id}|${p?.id ?? ""}|${html}`;
  if (el.dataset.sig === sig) return;
  const keep = {};
  el.querySelectorAll("input[id], select[id], textarea[id]").forEach((i) => { keep[i.id] = { value: i.value, type: i.type, focused: document.activeElement === i, s: i.selectionStart, e: i.selectionEnd }; });
  const ticked = [...el.querySelectorAll("input[type=checkbox][name]:checked")].map((b) => `${b.name}\u0000${b.value}`);
  const logOpen = el.querySelector("details.log")?.open;
  const samePrompt = el.dataset.prompt === (p?.id ?? "");
  el.innerHTML = html;
  el.dataset.sig = sig; el.dataset.prompt = p?.id ?? "";
  for (const [id, k] of Object.entries(keep)) {
    const i = document.getElementById(id);
    if (!i || ((id === "taskPw" || id.startsWith("qa-")) && !samePrompt)) continue;
    i.value = k.value; if (i.tagName === "INPUT") i.type = k.type;
    const eye = el.querySelector(`[data-eye="${CSS.escape(id)}"]`); if (eye) eye.textContent = k.type === "text" ? "🙈" : "👁";
    if (k.focused) { i.focus(); try { i.setSelectionRange(k.s, k.e); } catch { /* not a text box */ } }
  }
  if (samePrompt) el.querySelectorAll("input[type=checkbox][name]").forEach((b) => { if (ticked.includes(`${b.name}\u0000${b.value}`)) b.checked = true; });
  if (logOpen) el.querySelector("details.log").open = true;
  const lg = $("#tasklog"); if (lg) lg.scrollTop = lg.scrollHeight;
  el.querySelectorAll("[data-sitepw]").forEach((b) => b.onclick = async () => {
    const pw = document.getElementById(`sitepw-${b.dataset.sitepw}`)?.value;
    if (!pw) return toast("Type the password first", true);
    try {
      S.user = await api(`${U()}/secrets`, { method: "PUT", body: { host: b.dataset.host, password: pw } });
      toast("Password saved — applying again"); applyForMe(b.dataset.sitepw);
    } catch (e) { fail(e); }
  });
  $("#taskPw")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#taskPwSave")?.click(); });
  const respond = async (value) => { await api(`/tasks/${t.id}/respond`, { method: "POST", body: { promptId: p.id, value } }).catch(fail); pollTasks(true); };
  $("#qaSave")?.addEventListener("click", () => {
    const answers = {};
    for (const q of p.info.questions ?? []) {
      const boxes = [...el.querySelectorAll(`input[name="qa-${CSS.escape(q.id)}"]:checked`)];
      const v = boxes.length ? boxes.map((b) => b.value) : document.getElementById(`qa-${q.id}`)?.value?.trim();
      if (v === "true") answers[q.id] = true; else if (v === "false") answers[q.id] = false; else if (v && v.length) answers[q.id] = v;
    }
    const missing = (p.info.questions ?? []).filter((q) => answers[q.id] == null);
    if (missing.length) return toast(`Please answer: ${missing.map((q) => q.label.slice(0, 40)).join("; ")}`, true);
    respond(JSON.stringify({ answers }));
  });
  $("#qaClaude")?.addEventListener("click", () => respond(JSON.stringify({ useClaude: true })));
  $("#taskPwSave")?.addEventListener("click", async () => {
    const pw = $("#taskPw").value; if (!pw) return toast("Type a password first", true);
    try {
      S.user = await api(`${U()}/secrets`, { method: "PUT", body: { host: p.info?.host, password: pw } });
      await api(`/tasks/${t.id}/respond`, { method: "POST", body: { promptId: p.id, value: "ok" } });
      toast("Password saved — continuing"); pollTasks(true);
    } catch (e) { fail(e); }
  });
  el.querySelectorAll("[data-resp]").forEach((b) => b.onclick = async () => {
    await api(`/tasks/${t.id}/respond`, { method: "POST", body: { promptId: p.id, value: b.dataset.resp } }).catch(fail);
    pollTasks(true);
  });
  $("#stopTask")?.addEventListener("click", async () => { if (await modal({ title: "Stop?", body: "AutoApply stops after the current step.", ok: "Stop" })) { await api(`/tasks/${t.id}/stop`, { method: "POST", body: {} }); pollTasks(true); } });
  $("#hideTask")?.addEventListener("click", () => { taskHidden = true; el.innerHTML = ""; });
}

// ---------------- apply ----------------
// Like Tsenta: check everything an application needs *before* starting, ask for any gaps once, then run without stopping.
async function ensureReady(jobIds) {
  const q = jobIds?.length ? `?jobIds=${encodeURIComponent(jobIds.join(","))}` : "";
  const r = await api(`${U()}/readiness${q}`).catch(() => ({ ready: true, missing: [], blockers: [] }));
  if (r.blockers?.length) { toast(r.blockers.join(" · "), true); return false; }
  if (!r.missing?.length) return true;
  return new Promise((resolve) => {
    $("#modal").innerHTML = `<div class="modal-bg"><div class="modal" style="width:min(560px,100%)"><h2>Just once: a few details</h2>
      <p class="muted">Job sites ask for these. Add them now and AutoApply never has to stop mid-application to ask. They're saved to ${esc(S.user.profile.firstName)}'s profile.</p>
      <div class="form" id="readyForm" style="grid-template-columns:1fr 1fr">${r.missing.map((m) => inputFor([m.key, m.label, m.type])).join("")}</div>
      <div class="row"><button class="btn" id="rdCancel">Cancel</button><button class="btn primary" id="rdOk">Save & apply</button></div></div></div>`;
    $("#rdCancel").onclick = () => { $("#modal").innerHTML = ""; resolve(false); };
    $("#rdOk").onclick = async () => {
      const body = collect($("#readyForm"), S.user.profile);
      const still = r.missing.filter((m) => { const v = m.key.split(".").reduce((x, k) => x?.[k], body); return v == null || v === ""; });
      if (still.length) return toast(`Please fill: ${still.map((m) => m.label).join(", ")}`, true);
      try { S.user = await api(`${U()}/profile`, { method: "PUT", body }); $("#modal").innerHTML = ""; resolve(true); } catch (e) { fail(e); }
    };
  });
}

async function applyForMe(id, { dry } = {}) {
  const j = S.jobsById?.[id] ?? await api(`${U()}/jobs/${encodeURIComponent(id)}`);
  const resumeId = document.querySelector(`[data-resume-for="${CSS.escape(id)}"]`)?.value || j.resumeId;
  if (!dry && !(await ensureReady([id]))) return;
  // One click: no confirmation — AutoApply fills and submits the application by itself.
  if (!dry && !OFF) toast(`Applying to ${j.title} at ${j.company}…`);
  startTask({ type: "run", jobIds: [id], resumeId, dryRun: !!dry });
}
async function applyMany(ids) {
  if (!ids.length) return toast("No jobs to apply to", true);
  if (!(await ensureReady(ids))) return;
  if (!OFF) toast(`Applying to ${ids.length} job${ids.length > 1 ? "s" : ""}…`);
  startTask({ type: "run", jobIds: ids });
}
const findPeople = async (ids) => {
  const mode = S.user.search.aiMode;
  if (mode === "ask" && !(await modal({ title: "Use Claude to find people?", body: `Looking up the recruiter and hiring manager searches the web with Claude and uses your Claude subscription (${Math.min(ids.length, 5)} job${ids.length > 1 ? "s" : ""}). Continue?`, ok: "Yes, use Claude", cancel: "Cancel" }))) return;
  toast(mode === "off" ? "Claude is off — preparing LinkedIn searches only" : "Searching for recruiters and hiring managers…");
  startTask({ type: "contacts", jobIds: ids.slice(0, 5) });
};
document.addEventListener("change", (e) => {
  if (!["aiMode", "tailorMode"].includes(e.target.name)) return;
  document.querySelectorAll(".aimode").forEach((l) => l.classList.toggle("on", l.querySelector("input").checked));

window.applyForMe = applyForMe; window.findPeople = findPeople;
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;

});

}
const ring = (score) => `<div class="ring" style="--p:${score ?? 0};--c:${(score ?? 0) >= 80 ? "var(--good)" : "var(--warn)"}"><b>${score ?? "–"}%</b></div>`;

// ---------------- filters + command box ----------------
const EMPTY_FILTER = { text: "", companies: [], locations: [], minScore: 0, statuses: [], ats: [], remoteOnly: false, stages: [] };
S.filter = S.filter ?? structuredClone(EMPTY_FILTER);
function applyFilter(jobs, f = S.filter) {
  const lc = (x) => String(x ?? "").toLowerCase();
  const words = lc(f.text).split(/\s+/).filter(Boolean);
  return jobs.filter((j) => words.every((w) => lc(`${j.title} ${j.company}`).includes(w))
    && (!f.companies?.length || f.companies.some((c) => lc(j.company).includes(lc(c))))
    && (!f.locations?.length || f.locations.some((l) => lc(j.location).includes(lc(l))))
    && (!f.minScore || (j.score ?? 0) >= f.minScore)
    && (!f.statuses?.length || f.statuses.includes(j.status))
    && (!f.ats?.length || f.ats.includes(j.ats))
    && (!f.remoteOnly || /remote/i.test(j.location ?? ""))
    && (!f.stages?.length || f.stages.includes(j.stage ?? "applied")));
}
const filterActive = () => JSON.stringify(S.filter) !== JSON.stringify(EMPTY_FILTER);
function commandBar(placeholder) {
  return `<div class="card" style="margin-bottom:12px;padding:12px 14px"><div class="row"><span style="font-size:18px">✨</span>
      <input id="cmd" placeholder="${esc(placeholder)}" style="flex:1;min-width:200px"><button class="btn primary" id="cmdGo">Ask</button></div>
      <div id="cmdReply" class="muted" style="font-size:13px;margin-top:6px">${esc(S.cmdReply ?? "")}</div></div>`;
}
function wireCommand() {
  const go = async () => {
    const text = $("#cmd").value.trim(); if (!text) return;
    $("#cmdReply").textContent = "Thinking…"; $("#cmdGo").disabled = true;
    try {
      const r = await api(`${U()}/command`, { method: "POST", body: { text } });
      S.filter = r.action === "clear" ? structuredClone(EMPTY_FILTER) : { ...EMPTY_FILTER, ...r.filter };
      S.cmdReply = `${r.reply}${r.action !== "clear" ? ` (${r.count} job${r.count === 1 ? "" : "s"})` : ""}`;
      if (r.action === "find_jobs") startTask({ type: "discover" });
      if (r.action === "show_applications" && S.tab !== "applications") { S.tab = "applications"; store.set("aa.tab", S.tab); }
      if (r.action === "apply") { const ids = (await api(`${U()}/jobs?status=open`)).filter((j) => r.matchIds.includes(j.id) && j.status !== "submitted").map((j) => j.id); await applyMany(ids); }
      if (r.action === "find_contacts") findPeople(r.matchIds);
      render();
    } catch (e) { $("#cmdReply").textContent = e.message; } finally { const b = $("#cmdGo"); if (b) b.disabled = false; }
  };
  $("#cmdGo").onclick = go;
  $("#cmd").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
function filterBar(jobs, { stages } = {}) {

// Plain-language reason a found job was hidden.
function friendlyReason(r = "") {
  if (/titleInclude|title does not/.test(r)) return "the title has none of your job-title words (Job preferences → titles)";
  const ex = r.match(/excluded "(.+?)"/); if (ex) return `the title contains "${ex[1]}", which you excluded`;
  if (/location/.test(r)) return `it's outside your locations (${r.replace(/^location\s*/, "").replace(/ not in your locations$/, "")})`;
  return r || "didn't fit your preferences";
}

const FEED_DEFAULT = { view: "all", days: 0, loc: [], workplace: "", companies: [], exclude: [], min: 0, sort: "", maxexp: 0, visa: false, noclear: false, emp: [], pay: 0, degree: "", all: false };
function loadFeed() { try { return { ...FEED_DEFAULT, ...JSON.parse(store.get(`aa.feed.${S.userId}`) || "{}") }; } catch { return { ...FEED_DEFAULT }; } }

const agoText = (t) => { const ms = Date.now() - Date.parse(t); if (!t || Number.isNaN(ms)) return ""; const m = Math.floor(ms / 60e3), h = Math.floor(m / 60), d = Math.floor(h / 24); return m < 2 ? "1 minute ago" : m < 60 ? `${m} minutes ago` : h < 24 ? `${h} hour${h > 1 ? "s" : ""} ago` : d === 1 ? "1 day ago" : d < 30 ? `${d} days ago` : `${Math.floor(d / 30)} months ago`; };
const logoFor = (name = "?") => { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; const ini = name.replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?"; return `<div class="clogo" style="background:hsl(${h} 55% 45%)" title="${esc(name)}">${esc(ini)}</div>`; };
function feedQuery() {
  const f = S.feed, p = new URLSearchParams({ view: f.view });
  for (const k of ["sort", "days", "min", "workplace", "maxexp", "pay", "degree"]) if (f[k]) p.set(k, f[k]);
  for (const k of ["loc", "companies", "exclude", "emp"]) if (f[k].length) p.set(k, f[k].join(","));
  if (f.visa) p.set("visa", "1"); if (f.noclear) p.set("noclear", "1"); if (f.all) p.set("all", "1");

}

async function askAutoApply() {

/** A multi-select menu: search (for long lists), options with counts, and a Clear all / Done footer. */
function multiMenu(id, d) {
  const f = S.feed;
  const row = (value, label, n, checked) => `<label class="mrow" data-name="${esc(String(label).toLowerCase())}"><input type="checkbox" data-multi="${id}" value="${esc(value)}" ${checked ? "checked" : ""}><span class="mbox"></span><span class="mlabel">${esc(label)}</span>${n != null ? `<span class="mcount">${n}</span>` : ""}</label>`;
  const foot = (n) => `<div class="mfoot"><button class="mclear" data-clear="${id}" ${n ? "" : "disabled"}>Clear all${n ? ` (${n})` : ""}</button><button class="blackbtn sm" data-done>Done</button></div>`;
  if (id === "loc") {
    const counts = Object.fromEntries((d.countries ?? []).map((c) => [c.name, c.n]));
    const names = [...new Set([...(d.countries ?? []).map((c) => c.name), "Canada", "United States", "Remote", "United Kingdom", "India", "Germany", "Ireland", "France", "Netherlands", "Australia", "Singapore"])];
    return `<div class="mhead">Show jobs in</div><input class="msearch" data-search="loc" placeholder="Search countries…"><div class="mlist">${names.map((n) => row(n, n === "Remote" ? "Remote (anywhere)" : n, counts[n] ?? 0, f.loc.includes(n))).join("")}</div>${foot(f.loc.length)}`;
  }
  if (id === "companies") {
    return `<div class="mhead">Companies</div><input class="msearch" data-search="companies" placeholder="Search ${d.companies.length} companies…"><div class="mlist">${d.companies.map((c) => row(c.name.toLowerCase(), c.name, c.n, f.companies.includes(c.name.toLowerCase()))).join("") || `<div class="muted" style="padding:8px">No companies yet</div>`}</div>${foot(f.companies.length)}`;
  }
  if (id === "emp") {
    return `<div class="mhead">Employment type</div><div class="mlist">${EMP.map(([k, l]) => row(k, l, null, f.emp.includes(k))).join("")}</div>${foot(f.emp.length)}`;
  }
  // exclude: the person's own words (saved to preferences)
  return `<div class="mhead">Hide jobs whose title, company or location contains</div>
    <div class="mwords">${f.exclude.map((w) => `<span class="tchip"><span>${esc(w)}</span><button data-rmw="${esc(w)}" aria-label="Remove ${esc(w)}">×</button></span>`).join("") || `<span class="muted" style="font-size:12.5px">No words yet</span>`}</div>
    <div class="row" style="gap:6px;flex-wrap:nowrap"><input class="msearch" data-wordin placeholder="Type a word, press Enter (e.g. senior)"><button class="blackbtn sm" data-addw>Add</button></div>${foot(f.exclude.length)}`;
}

];
const getPath = (o, k) => k.split(".").reduce((x, p) => x?.[p], o);
function inputFor([key, label, type = "text", help]) {
  const val = getPath(S.user.profile, key);
  const h = help ? `<small>${esc(help)}</small>` : "";
  if (type === "yn") return `<label class="f"><span>${esc(label)}</span><select data-key="${key}" data-type="yn"><option value="">—</option><option value="true" ${val === true ? "selected" : ""}>Yes</option><option value="false" ${val === false ? "selected" : ""}>No</option></select>${h}</label>`;
  if (type.startsWith("select:")) return `<label class="f"><span>${esc(label)}</span><select data-key="${key}" data-type="str">${type.slice(7).split("|").map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${h}</label>`;
  if (type === "list") return `<label class="f wide"><span>${esc(label)}</span><input data-key="${key}" data-type="list" value="${esc((val ?? []).join(", "))}">${h}</label>`;
  return `<label class="f"><span>${esc(label)}</span><input data-key="${key}" data-type="${type === "num" ? "num" : "str"}" type="${type === "num" ? "number" : type === "email" ? "email" : type === "tel" ? "tel" : "text"}" value="${esc(val ?? "")}">${h}</label>`;
}
function collect(root, base) {
  const out = structuredClone(base);
  root.querySelectorAll("[data-key]").forEach((el) => {
    const path = el.dataset.key.split(".");
    let o = out; for (const p of path.slice(0, -1)) o = o[p] ??= {};
    const t = el.dataset.type; const last = path.at(-1);
    o[last] = t === "bool" ? el.checked : t === "yn" ? (el.value === "" ? null : el.value === "true") : t === "list" ? el.value.split(",").map((s) => s.trim()).filter(Boolean) : t === "num" ? (el.value === "" ? null : Number(el.value)) : (el.value === "" ? null : el.value);
  });
  return out;
}

    <div id="pf">${PROFILE_SECTIONS.map(([t, help, fields]) => `<div class="card"><h2>${esc(t)}</h2>${help ? `<p class="muted" style="margin:0 0 12px">${esc(help)}</p>` : `<div style="height:10px"></div>`}<div class="form">${fields.map(inputFor).join("")}</div></div>`).join("")}</div>

  // Email card: filled in after the page shows

    const anyOn = m.connected || m.imap;
    box.outerHTML = `
      ${anyOn ? `<div class="row"><span class="chip submitted">● Reading ${esc(m.imap?.user ?? m.email ?? "your email")}</span><span class="muted" style="font-size:12.5px">${m.lastSyncAt ? `checked ${esc(new Date(m.lastSyncAt).toLocaleString())}` : "not checked yet"}</span>
          <button class="btn sm" id="mailSync">Check email now</button>${m.imap ? `<button class="btn sm ghost danger" id="imapOff">Disconnect</button>` : ""}${m.connected ? `<button class="btn sm ghost danger" id="mailOff">Disconnect Google</button>` : ""}</div>
          ${m.unmatched?.length ? `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer">${m.unmatched.length} job emails that didn't match an application</summary>${m.unmatched.map((u) => `<div style="font-size:12.5px;padding:4px 0">${esc(u.subject)} <span class="muted">— ${esc(u.from)}</span></div>`).join("")}</details>` : ""}`
      : `<div class="mailopt"><b>Easiest: connect with an app password</b> <span class="chip matched">1 minute</span>
          <ol class="muted" style="margin:6px 0 8px;padding-left:18px;font-size:13px"><li>Open <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">myaccount.google.com/apppasswords</a> (Google asks you to sign in; 2-Step Verification must be on).</li><li>Name it “AutoApply”, press Create, and copy the 16-letter password.</li><li>Paste it here. It's stored only on this computer and only used to <i>read</i> job email.</li></ol>
          <div class="row" style="flex-wrap:nowrap"><input id="imapEmail" value="${esc(p.email ?? "")}" placeholder="you@gmail.com" style="max-width:240px"><div style="flex:1;max-width:240px">${pwField("imapPass", "16-letter app password")}</div><button class="btn primary" id="imapOn">Connect</button></div>
          ${m.clientReady && local ? `<div class="muted" style="font-size:12.5px;margin-top:8px">Or <a class="l" id="mailOn">sign in with Google</a> instead.</div>` : ""}</div>`}
      <details class="mailopt" style="margin-top:12px" ${m.alias ? "open" : ""}><summary style="cursor:pointer"><b>Job-application address, like Tsenta</b> <span class="muted" style="font-size:12.5px">— optional, needs a domain on Cloudflare</span></summary>
        <p class="muted" style="font-size:13px;margin:6px 0">Applications use an address such as <i>${esc((p.firstName ?? "me").toLowerCase())}@jobs.yourdomain.com</i>. Its mail comes to AutoApply first (codes entered and verify links clicked automatically), then is forwarded to your real inbox. Set-up steps: SHARING.md → “Job-application address”.</p>
        <div class="row" style="flex-wrap:nowrap"><input id="aliasIn" value="${esc(m.alias ?? "")}" placeholder="${esc((p.firstName ?? "me").toLowerCase())}@jobs.yourdomain.com" style="max-width:300px"><button class="btn" id="aliasSave">Save</button></div>
        <label class="perm" style="border:0;padding:6px 0 0"><span class="switch"><input id="aliasUse" type="checkbox" ${m.useAlias ? "checked" : ""} ${m.alias ? "" : "disabled"}><span></span></span><span class="txt"><b>Use this address on applications</b><small>Turn on once the Cloudflare forwarding works (send a test email to it first).</small></span></label>
        ${m.inboundReady ? `<div class="muted" style="font-size:12px">Worker key: shown to the owner after saving an address.</div>` : ""}</details>`;
    $("#imapOn") && ($("#imapOn").onclick = async () => {
      toast("Checking the app password…");
      try { await api(`${U()}/mail/imap`, { method: "POST", body: { email: $("#imapEmail").value.trim(), appPassword: $("#imapPass").value } }); toast("✓ Connected — verification codes and recruiter replies are now handled automatically"); render(); } catch (e) { fail(e); }
    });
    $("#imapOff") && ($("#imapOff").onclick = async () => { await api(`${U()}/mail/imap`, { method: "POST", body: { remove: true } }).catch(fail); render(); });
    $("#aliasSave").onclick = async () => { try { const r = await api(`${U()}/mail/alias`, { method: "POST", body: { alias: $("#aliasIn").value.trim() } }); if (r.inboundKey) modal({ title: "Saved", body: `Put this key in the Cloudflare Email Worker as <b>AUTOAPPLY_KEY</b>:<br><code style="user-select:all;word-break:break-all">${esc(r.inboundKey)}</code>`, ok: "Done", cancel: "" }); render(); } catch (e) { fail(e); } };
    $("#aliasUse").onchange = async (e) => { try { await api(`${U()}/mail/alias`, { method: "POST", body: { useAlias: e.target.checked } }); toast(e.target.checked ? "Applications now use your job-application address" : "Applications use your own email again"); } catch (err) { fail(err); } };
    $("#mailOn") && ($("#mailOn").onclick = async () => { try { location.href = (await api(`${U()}/mail/connect`, { method: "POST", body: {} })).url; } catch (e) { fail(e); } });
    $("#mailSync") && ($("#mailSync").onclick = async () => { toast("Checking email…"); try { const r = await api(`${U()}/mail/sync`, { method: "POST", body: {} }); toast(`Checked ${r.scanned} new emails: ${r.routed.length} filed, ${r.stageChanges} stage changes, ${r.drafts} reply drafts`); render(); } catch (e) { fail(e); } });
    $("#mailOff") && ($("#mailOff").onclick = async () => { await api(`${U()}/mail/disconnect`, { method: "POST", body: {} }).catch(fail); render(); });
  }).catch(() => {});
  $("#pSave").onclick = async () => { try { S.user = await api(`${U()}/profile`, { method: "PUT", body: collect($("#pf"), p) }); render(); toast("Profile saved"); } catch (e) { fail(e); } };
  $("#pwSave").onclick = async () => {
    const pw = $("#atsPw").value; if (!pw) return toast("Type a password first", true);
    try { S.user = await api(`${U()}/secrets`, { method: "PUT", body: { atsPassword: pw } }); toast("Password saved"); render(); } catch (e) { fail(e); }
  };
  $("#permSave").onclick = async () => {
    try {
      await api(`${U()}/profile`, { method: "PUT", body: { ...p, consentToApplicationNotices: $("#pConsent").checked, permissions: { ...perms, createAccounts: $("#pAccounts").checked } } });
      S.user = await api(`${U()}/search`, { method: "PUT", body: { ...s, mode: $("#pAuto").checked ? "auto" : "review", aiMode: document.querySelector("input[name=aiMode]:checked")?.value ?? "ask", bestJudgment: $("#pJudge").checked, tailorMode: document.querySelector("input[name=tailorMode]:checked")?.value ?? "honest", tailorResume: document.querySelector("input[name=tailorMode]:checked")?.value !== "off", autoApproveResume: $("#pApprove").checked } });
      render(); toast("Permissions saved");
    } catch (e) { fail(e); }
  };
};

      <div class="form">
