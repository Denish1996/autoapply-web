    <div class="card" id="mailCard"><div class="card-head"><div style="font-size:22px">✉️</div><div><h2>Email <span class="chip">Optional</span></h2><p>Lets AutoApply enter verification codes for ${esc(p.firstName)} and show replies from employers it applied to. <b>Only emails about AutoApply's applications are kept.</b> Other email is never saved or shown. It never sends or deletes anything.</p></div></div><div class="muted">Loading…</div></div>
    </div>
    <div data-pgroup="details"><div id="pf">${PROFILE_SECTIONS.map(([t, help, fields]) => `<div class="card"><h2>${esc(t)}</h2>${help ? `<p class="muted" style="margin:0 0 12px">${esc(help)}</p>` : `<div style="height:10px"></div>`}<div class="form">${fields.map(inputFor).join("")}</div></div>`).join("")}</div>

  const showGroup = () => { const g = S.profTab ?? "details"; v.querySelectorAll("[data-pgroup]").forEach((el) => { el.hidden = el.dataset.pgroup !== g; }); v.querySelectorAll("[data-ptabsel]").forEach((b) => b.classList.toggle("on", b.dataset.ptabsel === g)); };

  // Email card: filled in after the page shows
  api(`${U()}/mail`).then((m) => {
    const box = $("#mailCard .muted:last-child"); if (!box) return;
    const local = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
    const anyOn = m.connected || m.imap;
    box.outerHTML = `
      ${anyOn ? `<div class="row"><span class="chip submitted">● Reading ${esc(m.imap?.user ?? m.email ?? "your email")}</span><span class="muted" style="font-size:12.5px">${m.lastSyncAt ? `checked ${esc(new Date(m.lastSyncAt).toLocaleString())}` : "not checked yet"}</span>
          <button class="btn sm" id="mailSync">Check email now</button>${m.imap ? `<button class="btn sm ghost danger" id="imapOff">Disconnect</button>` : ""}${m.connected ? `<button class="btn sm ghost danger" id="mailOff">Disconnect Google</button>` : ""}</div>
          ${m.unmatched?.length ? `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer">${m.unmatched.length} job emails that didn't match an application</summary>${m.unmatched.map((u) => `<div style="font-size:12.5px;padding:4px 0">${esc(u.subject)} <span class="muted">— ${esc(u.from)}</span></div>`).join("")}</details>` : ""}`
      : `<div class="mailopt"><b>Easiest: connect with an app password</b> <span class="chip matched">1 minute</span>
          <ol class="muted" style="margin:6px 0 8px;padding-left:18px;font-size:13px"><li>Open <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">myaccount.google.com/apppasswords</a> (Google asks you to sign in; 2-Step Verification must be on).</li><li>Name it “AutoApply”, press Create, and copy the 16-letter password.</li><li>Paste it here. It is kept private and only used to <i>read</i> emails about your applications.</li></ol>
          <div class="row" style="flex-wrap:nowrap"><input id="imapEmail" type="email" value="${esc(gmailOf(p.email))}" placeholder="john.doe@gmail.com" style="max-width:240px"><div style="flex:1;max-width:240px">${pwField("imapPass", "Paste the app password from Google")}</div><button class="btn primary" id="imapOn">Connect</button></div>
          ${m.clientReady && local ? `<div class="muted" style="font-size:12.5px;margin-top:8px">Or <a class="l" id="mailOn">sign in with Google</a> instead.</div>` : ""}</div>`}

        <p class="muted" style="font-size:13px;margin:6px 0">Applications use an address such as <i>${esc((p.firstName ?? "me").toLowerCase())}@jobs.yourdomain.com</i>. Its mail comes to AutoApply first (codes entered and verify links clicked automatically), then is forwarded to your real inbox. Set-up steps: SHARING.md → “Job-application address”.</p>
        <div class="row" style="flex-wrap:nowrap"><input id="aliasIn" value="${esc(m.alias ?? "")}" placeholder="${esc((p.firstName ?? "me").toLowerCase())}@jobs.yourdomain.com" style="max-width:300px"><button class="btn" id="aliasSave">Save</button></div>
        <label class="perm" style="border:0;padding:6px 0 0"><span class="switch"><input id="aliasUse" type="checkbox" ${m.useAlias ? "checked" : ""} ${m.alias ? "" : "disabled"}><span></span></span><span class="txt"><b>Use this address on applications</b><small>Turn on once the Cloudflare forwarding works (send a test email to it first).</small></span></label>
        ${m.inboundReady ? `<div class="muted" style="font-size:12px">Worker key: shown to the owner after saving an address.</div>` : ""}</details>`;
    $("#imapOn") && ($("#imapOn").onclick = async () => {
      toast("Checking the app password…");
      try { await api(`${U()}/mail/imap`, { method: "POST", body: { email: $("#imapEmail").value.trim(), appPassword: $("#imapPass").value } }); toast("✓ Connected. Verification codes and replies about your applications are handled automatically."); render(); } catch (e) { fail(e); }
    });
    $("#imapOff") && ($("#imapOff").onclick = async () => { await api(`${U()}/mail/imap`, { method: "POST", body: { remove: true } }).catch(fail); render(); });
    $("#aliasSave").onclick = async () => { try { const r = await api(`${U()}/mail/alias`, { method: "POST", body: { alias: $("#aliasIn").value.trim() } }); if (r.inboundKey) modal({ title: "Saved", body: `Put this key in the Cloudflare Email Worker as <b>AUTOAPPLY_KEY</b>:<br><code style="user-select:all;word-break:break-all">${esc(r.inboundKey)}</code>`, ok: "Done", cancel: "" }); render(); } catch (e) { fail(e); } };
    $("#aliasUse").onchange = async (e) => { try { await api(`${U()}/mail/alias`, { method: "POST", body: { useAlias: e.target.checked } }); toast(e.target.checked ? "Applications now use your job-application address" : "Applications use your own email again"); } catch (err) { fail(err); } };
    $("#mailOn") && ($("#mailOn").onclick = async () => { try { location.href = (await api(`${U()}/mail/connect`, { method: "POST", body: {} })).url; } catch (e) { fail(e); } });
    $("#mailSync") && ($("#mailSync").onclick = async () => { toast("Checking email…"); try { const r = await api(`${U()}/mail/sync`, { method: "POST", body: {} }); toast(`Checked ${r.scanned} new emails: ${r.routed.length} filed, ${r.stageChanges} stage changes, ${r.drafts} reply drafts`); render(); } catch (e) { fail(e); } });
    $("#mailOff") && ($("#mailOff").onclick = async () => { await api(`${U()}/mail/disconnect`, { method: "POST", body: {} }).catch(fail); render(); });
  }).catch(() => {});
  $("#pSave").onclick = async () => { try { S.user = await api(`${U()}/profile`, { method: "PUT", body: collect($("#pf"), p) }); render(); toast("Profile saved"); } catch (e) { fail(e); } };
  $("#pwSave").onclick = async () => {
    const pw = $("#atsPw").value; if (!pw) return toast("Type a password first", true);
    try { S.user = await api(`${U()}/secrets`, { method: "PUT", body: { atsPassword: pw } }); toast("Password saved"); render(); } catch (e) { fail(e); }
  };
  $("#permSave").onclick = async () => {
    try {
      await api(`${U()}/profile`, { method: "PUT", body: { ...p, consentToApplicationNotices: $("#pConsent").checked, permissions: { ...perms, createAccounts: $("#pAccounts").checked } } });
      S.user = await api(`${U()}/search`, { method: "PUT", body: { ...s, mode: $("#pAuto").checked ? "auto" : "review", aiMode: document.querySelector("input[name=aiMode]:checked")?.value ?? "ask", bestJudgment: $("#pJudge").checked, aiRescue: (document.querySelector("input[name=aiMode]:checked")?.value ?? "ask") === "off" ? s.aiRescue : $("#pRescue").checked, tailorMode: document.querySelector("input[name=tailorMode]:checked")?.value ?? "honest", tailorResume: document.querySelector("input[name=tailorMode]:checked")?.value !== "off", autoApproveResume: $("#pApprove").checked } });
      render(); toast("Permissions saved");
    } catch (e) { fail(e); }
  };
};

VIEWS.questions = async (v) => {
  const [un, learned, mailAll, apps] = await Promise.all([api(`${U()}/inbox`), api(`${U()}/learned`), api(`${U()}/mail/all`).catch(() => ({ items: [] })), api(`${U()}/jobs?status=applications`).catch(() => [])]);
  // applications that didn't go through recently and haven't been looked at: each with the reason and what to do
  const failed = apps.filter((r) => r.status === "failed" && !r.failureSeen && Date.now() - Date.parse(r.updatedAt ?? 0) < 14 * 864e5);
  // emails that usually need the person to do something (reply, book a time, take a test), from the last two weeks
  const actMail = (mailAll.items ?? []).filter((m) => m.type === "received" && (["interview", "assessment", "offer"].includes(m.kind) || (m.kind === "recruiter" && m.job)) && Date.now() - Date.parse(m.date) < 14 * 24 * 3600e3).slice(0, 8);
  const bank = S.user.answers;
  v.addEventListener("click", async (e) => {
    const sv = e.target.closest("[data-lsave]"), dl = e.target.closest("[data-ldel]");
    if (!sv && !dl) return;
    const i = Number((sv ?? dl).dataset.lsave ?? (sv ?? dl).dataset.ldel);
    try {
      await api(`${U()}/learned`, { method: "PUT", body: dl ? { key: learned[i].key, remove: true } : { key: learned[i].key, answer: v.querySelector(`[data-l="${i}"]`).value } });
      toast(dl ? "Forgotten" : "Answer updated"); render();
    } catch (err) { fail(err); }
  });
  const KIND = { question: "❓", verify: "✉️", captcha: "🧩", mfa: "🔐", account: "👤", review: "👀" };
  const jobsLine = (q) => q.jobs?.length ? `${q.jobs.length} job${q.jobs.length > 1 ? "s" : ""} waiting: ${q.jobs.slice(0, 3).map((j) => esc(`${j.company} — ${j.title}`)).join(", ")}${q.jobs.length > 3 ? "…" : ""}` : `Asked by: ${(q.seenAt ?? []).map(esc).join(", ")}`;
  // a question's input (answered together with the rest of the application's questions, then one Save button)
  const inputFor = (q, i) => {
    if (q.options?.length && q.options.length <= 6) return `<div class="fyopts">${q.options.map((o) => `<label class="fyopt"><input type="radio" name="fq-${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`;
    if (q.options?.length) return `<select data-q="${i}"><option value="">Choose…</option>${q.options.map((o) => `<option>${esc(o)}</option>`).join("")}</select>`;
    return `<textarea data-q="${i}" rows="2" placeholder="Your answer"></textarea>`;
  };
  // checks that aren't questions (verify an email, a human check…) keep their own button: they're done outside AutoApply
  const actionUi = (i) => `<div class="row"><button class="btn sm" data-done="${i}">Done — try again</button><button class="btn sm ghost" data-dismiss="${i}">Dismiss</button></div>`;
  const WHAT = { question: "Question", verify: "Verify your email", captcha: "Human check", mfa: "Sign-in code", account: "Job-site account", review: "Check before sending" };
  // One card per role (employer + job title): all of its questions together, then one row of buttons. A question
  // several roles share shows on each; answering it once covers them all.
  const groups = [];
  const norm1 = (x) => String(x ?? "").trim().toLowerCase();
  un.forEach((q, i) => {
    const first = (q.seenAt ?? [])[0] ?? "";
    const targets = q.jobs?.length ? q.jobs.map((j) => ({ company: j.company, title: j.title, id: j.id })) : [{ company: first.split(" — ")[0], title: first.split(" — ").slice(1).join(" — "), id: null }];
    for (const t of targets) {
      const key = `${norm1(t.company)}|${norm1(t.title)}`;
      let g = groups.find((x) => x.key === key);
      if (!g) groups.push(g = { key, company: displayCo(t.company), title: t.title, jobIds: [], items: [] });
      if (t.id && !g.jobIds.includes(t.id)) g.jobIds.push(t.id);
      if (!g.items.some((x) => x.i === i)) g.items.push({ q, i });
    }
  });
  const also = (q, g) => { const others = (q.jobs ?? []).filter((j) => !g.jobIds.includes(j.id)).filter((j, k, all) => all.findIndex((x) => norm1(x.company) === norm1(j.company) && norm1(x.title) === norm1(j.title)) === k); return others.length ? `<div class="muted" style="font-size:12.5px;margin-top:3px">Also asked by ${others.slice(0, 3).map((j) => esc(`${displayCo(j.company)} (${j.title})`)).join(", ")}${others.length > 3 ? " and others" : ""}. One answer covers all of them.</div>` : ""; };
  const groupHtml = (g, gi) => {
    const qs = g.items.filter(({ q }) => q.kind === "question");
    return `<div class="card fy" data-g="${gi}"><div class="fyhead" ${g.jobIds[0] ? `data-open="${esc(g.jobIds[0])}" title="Open this application"` : ""}>${logoFor(g.company || "?")}<div style="min-width:0;flex:1"><div class="fyco">${esc(g.company || "An earlier application")}</div><div class="fyjob">${esc(g.title)}${g.jobIds.length > 1 ? ` <span class="muted">· ${g.jobIds.length} openings</span>` : ""}</div></div><span class="chip needs_input">${qs.length ? `${qs.length} to answer` : `${g.items.length} to do`}</span></div>
      ${g.items.map(({ q, i }) => `<div class="fyq"><div class="fyk">${esc(WHAT[q.kind] ?? "Question")}</div><div class="fyt">${esc(q.question)}</div>${also(q, g)}<div style="margin-top:10px">${q.kind === "question" ? inputFor(q, i) : actionUi(i)}</div></div>`).join("")}
      <div class="fyfoot">${g.company ? `<button class="btn sm ghost" data-skipco="${gi}" title="Skip every job at ${esc(g.company)}, now and in future searches">Skip this company</button>` : ""}${g.jobIds.length ? `<button class="btn sm ghost" data-skiprole="${gi}">Skip this role</button>` : ""}${qs.length ? `<button class="btn sm primary" data-saveall="${gi}">${g.jobIds.length ? "Save answers & apply" : "Save answers"}</button>` : ""}</div></div>`;
  };
  v.innerHTML = `<h1>For you</h1><p class="sub">Things only ${esc(S.user.profile.firstName || "you")} can do: questions AutoApply couldn't answer, emails to verify, and human checks. Answer once and it is remembered; the waiting jobs are retried right away.</p>

    <details class="card"><summary style="cursor:pointer"><b>Saved answers</b> <span class="muted">· ${learned.length} remembered, ${Object.keys(bank).length} of your own</span></summary>
    <div style="margin-top:14px"><div class="row"><h2 style="flex:1">Answers remembered from past applications (${learned.length})</h2>
      ${learned.length ? `<a class="btn sm" href="/api${U()}/learned?format=csv">⬇ Download (opens in Excel)</a>` : ""}</div>
      <p class="muted" style="margin:4px 0 12px">When a new question is answered, the answer is saved here and reused the next time the question comes up. Company-specific questions ("Why do you want to work here?") are always written fresh. Edit any answer to change what's given next time.</p>
      ${learned.length ? `<div id="learned">${learned.map((e, i) => `<div class="kv" style="grid-template-columns:1fr 1.2fr auto auto"><div><b style="font-weight:550">${esc(e.question)}</b><div class="muted" style="font-size:12px">${e.source === "you" ? "edited by you" : e.source === "judgment" ? "best judgment" : "AI"} · ${esc(e.from ?? "")}${e.uses ? ` · reused ${e.uses}×` : ""}</div></div>
        ${e.options?.length ? `<select data-l="${i}">${e.options.map((o) => `<option ${o === e.answer ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>` : `<textarea data-l="${i}" style="min-height:40px">${esc(Array.isArray(e.answer) ? e.answer[0] : e.answer)}</textarea>`}
        <button class="btn sm" data-lsave="${i}">Save</button><button class="btn sm ghost danger" data-ldel="${i}" title="Forget">✕</button></div>`).join("")}</div>`
      : `<div class="muted" style="font-size:13px">Nothing yet — answers appear here after the first applications.</div>`}
    </div>
    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"><h2>Your own answers</h2><p class="muted" style="margin:0 0 12px">A phrase from the question → the answer to give. These always win. The longest matching phrase wins.</p>
    <div id="bank">${Object.entries(bank).map(([k, a]) => `<div class="kv"><input value="${esc(k)}"><input value="${esc(a ?? "")}"><button class="btn sm ghost danger" data-rm>✕</button></div>`).join("")}</div>
    <div class="row"><button class="btn sm" id="addKv">＋ Add</button><span class="spacer"></span><button class="btn primary" id="bankSave">Save answers</button></div></div></details>`;
  v.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openJob(b.dataset.open));
  v.querySelectorAll("[data-seen]").forEach((b) => b.onclick = async () => { try { await api(`${U()}/jobs/${encodeURIComponent(b.dataset.seen)}/seen`, { method: "POST", body: {} }); await loadUsers(); render(); } catch (e) { fail(e); } });
  const send = async (i, answer, retry = true) => {
    try {
      const r = await api(`${U()}/inbox`, { method: "POST", body: { key: un[i].key, answer, retry } });
      const n = r.requeued.length;
      toast(n ? (r.task ? `Saved — retrying ${n} job${n > 1 ? "s" : ""} now` : `Saved — ${n} job${n > 1 ? "s" : ""} ready to retry`) : "Saved");
      if (r.task) pollTasks(true);
      await loadUsers(); render();
    } catch (e) { fail(e); }
  };
  // the value given for question i: a picked option, a chosen item, or typed text
  const valueOf = (i) => (v.querySelector(`input[name="fq-${i}"]:checked`)?.value ?? v.querySelector(`[data-q="${i}"]`)?.value ?? "").trim();
  v.querySelectorAll("[data-saveall]").forEach((b) => b.onclick = async () => {
    const g = groups[Number(b.dataset.saveall)];
    const qs = g.items.filter(({ q }) => q.kind === "question");
    const blank = qs.filter(({ i }) => !valueOf(i));
    v.querySelectorAll(`[data-g="${b.dataset.saveall}"] .fyq`).forEach((el) => el.classList.remove("need"));
    if (blank.length) {
      for (const { i } of blank) (v.querySelector(`[data-q="${i}"]`) ?? v.querySelector(`input[name="fq-${i}"]`))?.closest(".fyq")?.classList.add("need");
      v.querySelector(".fyq.need")?.scrollIntoView({ block: "center", behavior: "smooth" });
      return toast(blank.length === qs.length ? "Answer the questions first" : `${blank.length} question${blank.length > 1 ? "s" : ""} still need an answer`, true);
    }
    b.disabled = true;
    try {
      const r = await api(`${U()}/inbox`, { method: "POST", body: { answers: qs.map(({ q, i }) => ({ key: q.key, answer: valueOf(i) })), retry: g.jobIds.length > 0 } });
      const n = r.requeued.length;
      toast(n ? (r.task ? `Saved — applying to ${n} job${n > 1 ? "s" : ""} now` : `Saved — ${n} job${n > 1 ? "s" : ""} will be applied to next`) : "Answers saved");
      if (r.task) pollTasks(true);
      await loadUsers(); render();
    } catch (e) { b.disabled = false; fail(e); }
  });
  const skip = async (body, msg) => { try { const r = await api(`${U()}/inbox/skip`, { method: "POST", body }); toast(msg(r.skipped)); await loadUsers(); render(); } catch (e) { fail(e); } };
  v.querySelectorAll("[data-skiprole]").forEach((b) => b.onclick = () => { const g = groups[Number(b.dataset.skiprole)]; skip({ jobIds: g.jobIds }, () => `Skipped ${g.title} at ${g.company}`); });
  v.querySelectorAll("[data-skipco]").forEach((b) => b.onclick = () => { const g = groups[Number(b.dataset.skipco)]; skip({ jobIds: g.jobIds, company: g.company }, (n) => `Skipped ${g.company}${n > 1 ? ` (${n} jobs)` : ""}. To undo: Job preferences → Companies you skipped`); });
  v.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => send(Number(b.dataset.done), null));
  v.querySelectorAll("[data-dismiss]").forEach((b) => b.onclick = () => send(Number(b.dataset.dismiss), null, false));
  v.addEventListener("click", (e) => { if (e.target.matches("[data-rm]")) e.target.closest(".kv").remove(); });
  $("#addKv").onclick = () => $("#bank").insertAdjacentHTML("beforeend", `<div class="kv"><input placeholder="question phrase"><input placeholder="answer"><button class="btn sm ghost danger" data-rm>✕</button></div>`);
  $("#bankSave").onclick = async () => {
    const out = {};
    $("#bank").querySelectorAll(".kv").forEach((r) => { const [k, a] = r.querySelectorAll("input"); if (k.value.trim()) out[k.value.trim().toLowerCase()] = a.value.trim() || null; });
    S.user = await api(`${U()}/answers`, { method: "PUT", body: out }); render(); toast("Answers saved");
  };
};

// Email: every message AutoApply has seen for this person (matched to an application or not) and the reply drafts
// it wrote. AutoApply never sends email; drafts are opened in the person's own mail to send.

  const compose = (m) => `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent((m.to.match(/<([^>]+)>/)?.[1] ?? m.to))}&su=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;

    : `<div class="mrow2"><div class="micon">${ICON.mail}</div><div style="min-width:0"><span class="chip">${esc(MAILKIND[m.kind] ?? m.kind ?? "Email")}</span> <span class="ms">${esc(m.subject)}</span><div class="mf">${esc(m.from ?? "")}${m.job ? ` · ${esc(m.job.company)} — ${esc(m.job.title)}` : ""}</div>${m.snippet ? `<div class="mp">${esc(m.snippet)}</div>` : ""}
        ${m.job ? `<div class="row" style="margin-top:8px"><button class="btn sm" data-open="${esc(m.job.id)}">Open application</button></div>` : ""}</div><div class="mwhen">${when(m.date)}</div></div>`;
  v.innerHTML = `<div class="row" style="align-items:flex-start"><div style="flex:1"><h1>Email</h1><p class="sub">Emails about the jobs AutoApply applied to for ${esc(S.user.profile.firstName || "this person")}, and reply drafts it wrote. Nothing else from the mailbox is kept, and AutoApply never sends email itself.</p></div>
      ${d.connected && !OFF ? `<button class="btn" id="mailCheck">Check for new email</button>` : ""}</div>
    ${d.connected ? `<div class="muted" style="font-size:13px;margin:-10px 0 14px">Connected to <b>${esc(d.email ?? "your mailbox")}</b>${d.lastSyncAt ? ` · last checked ${esc(new Date(d.lastSyncAt).toLocaleString())}` : ""}</div>`
      : `<div class="banner info"><div>${ICON.mail}</div><div style="flex:1"><b>No mailbox connected.</b> Connect ${esc(S.user.profile.firstName || "their")}'s email so replies about these applications show up here and verification codes are entered automatically. Other email is never saved.</div><button class="btn sm primary" data-connectmail>Connect Gmail</button></div>`}
    <div class="tabs">${[["all", "All", items.length], ["received", "Received", got.length], ["drafts", "Drafts", drafts.length]].map(([k, l, n]) => `<button data-mtab="${k}" class="${tab === k ? "on" : ""}">${l}<span class="n">${n}</span></button>`).join("")}</div>
    ${rows.length ? `<div class="card" style="padding:4px 14px">${rows.map(row).join("")}</div>` : `<div class="card empty"><div class="big">📭</div><p>${tab === "drafts" ? "No reply drafts." : "No emails yet. Replies from employers appear here after AutoApply applies."}</p></div>`}`;
  v.querySelectorAll("[data-mtab]").forEach((b) => b.onclick = () => { S.mailTab = b.dataset.mtab; render(); });

};

let AUTH = { mode: "login", step: "email", email: "", name: "" };
// Password rules (the server checks the same ones). All unmet rules are shown, live, as the person types.
const PW_RULES = [["length", "At least 8 characters", (p) => p.length >= 8], ["lower", "A lowercase letter", (p) => /[a-z]/.test(p)], ["upper", "An uppercase letter", (p) => /[A-Z]/.test(p)], ["number", "A number", (p) => /\d/.test(p)]];
const pwMissing = (p) => PW_RULES.filter(([, , ok]) => !ok(p)).map(([, t]) => t.toLowerCase());
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

async function showLogin(mode) {
  const st = HOSTED && !API ? { offline: true } : await api("/auth/state").catch((e) => ({ offline: e.offline }));
  if (mode) AUTH = { ...AUTH, mode, step: "email" };
  if (st.needsSetup && !["setup", "reset"].includes(AUTH.mode)) AUTH = { ...AUTH, mode: "setup", step: "email" };
  let el = $("#login");
  if (!el) { el = document.createElement("div"); el.className = "auth"; el.id = "login"; document.body.append(el); }
  const sb = st.supabase;
  const google = sb?.google && AUTH.step === "email" ? `<button type="button" class="oauth" id="lgGoogle">${GOOGLE} Continue with Google</button><div class="or">Or continue with email</div>` : "";
  const T = { login: ["Welcome back", "Log in to AutoApply."], signup: ["Create your account", "Start applying in minutes."], setup: ["Set up AutoApply", "Create the owner account. You can invite family afterwards."],
    forgot: ["Forgot your password?", "We'll help you choose a new one."], reset: ["Choose a new password", AUTH.email ? `For ${AUTH.email}` : ""] }[AUTH.mode];
  const who = `<div class="who"><span>${esc(AUTH.email)}</span><a class="l" data-lg-back>Change</a></div>`;
  const err = (id) => `<div class="ferr" id="err-${id}" role="alert"></div>`;
  const emailField = `<label class="f"><span>Email address</span><input id="lgEmail" type="email" inputmode="email" autocomplete="username" placeholder="john.doe@gmail.com" value="${esc(AUTH.email)}">${err("email")}</label>`;
  const pwInput = (auto) => `<div class="pw"><input id="lgPw" type="password" autocomplete="${auto}"><button type="button" class="eye" id="lgEye" title="Show or hide the password" aria-label="Show or hide the password">👁</button></div>`;
  const newPw = (label) => `<label class="f"><span>${label}</span>${pwInput("new-password")}</label>
      <ul class="pwrules" id="pwRules">${PW_RULES.map(([id, t]) => `<li data-rule="${id}">${t}</li>`).join("")}</ul>${err("pw")}`;
  const note = AUTH.notice ? `<div class="banner info" style="margin:0 0 14px"><div>${esc(AUTH.notice)}</div></div>` : "";
  let body;
  const offlineLogin = st.offline && SB.cfg;
  if (AUTH.mode === "reset") body = AUTH.resetError
      ? `<div class="banner"><div>⚠️</div><div>${esc(AUTH.resetError)}</div></div><button type="button" class="btn primary go" data-lg="forgot">Ask for a new link</button>`
      : `${newPw("New password")}<button class="btn primary go" type="submit">Save password and log in</button>`;
  else if (offlineLogin) body = `<div class="banner"><div>📴</div><div><b>Sign in to see your jobs and applications.</b> Anything you do now is saved and carried out shortly.</div></div>
      ${emailField}
      <label class="f"><span>Password</span>${pwInput("current-password")}${err("pw")}</label>
      <button class="btn primary go" type="submit">Log in</button>`;
  else if (st.offline) body = `<div class="banner"><div>⚠️</div><div><b>AutoApply can't be reached right now.</b> Please try again in a few minutes.</div></div><button type="button" class="btn primary go" onclick="location.reload()">Try again</button>`;
  else if (AUTH.mode === "forgot" && AUTH.step === "sent") body = `<div class="banner info"><div>✉️</div><div>${AUTH.emailed
        ? `If <b>${esc(AUTH.email)}</b> has an account, a link to choose a new password is on its way. It can take a few minutes; check the spam folder too.`
        : `If <b>${esc(AUTH.email)}</b> has an account, the person who runs this AutoApply has been told. They'll send you a link to choose a new password.`}</div></div>
      <button type="button" class="btn primary go" data-lg="login">Back to log in</button>`;
  else if (AUTH.mode === "forgot") body = `${emailField}<button class="btn primary go" type="submit">Reset my password</button>`;
  else if (AUTH.step === "email" && AUTH.mode === "login") body = `${google}${emailField}<button class="btn primary go" type="submit">Continue →</button>`;
  else if (AUTH.step === "password") body = `${who}<label class="f"><span>Password</span>${pwInput("current-password")}${err("pw")}</label>
      <div style="text-align:right;margin-top:8px;font-size:13px"><a class="l" data-lg="forgot">Forgot password?</a></div>
      <button class="btn primary go" type="submit">Log in</button>`;
  else if (AUTH.step === "closed") body = `${who}<div class="banner" style="margin-top:14px"><div>🔒</div><div>There's no account for this email, and new sign-ups are by invitation only. Ask the person who runs AutoApply to invite you.</div></div>`;
  else body = `${note}${AUTH.step === "email" ? google : who}
      <label class="f"><span>Full name</span><input id="lgName" autocomplete="name" value="${esc(AUTH.name)}">${err("name")}</label>
      ${AUTH.step === "email" ? emailField : ""}
      ${newPw("Password")}
      <button class="btn primary go" type="submit">${AUTH.mode === "setup" ? "Create owner account" : "Create account"}</button>
      ${AUTH.mode === "signup" && st.signups === "approval" && !AUTH.invited ? `<div class="fine">New accounts are approved by the person who runs AutoApply before they can apply.</div>` : ""}`;
  const foot = st.offline || AUTH.mode === "setup" || AUTH.mode === "reset" ? "" : AUTH.mode === "login" ? `Don't have an account? <a class="l" data-lg="signup">Sign up</a>` : AUTH.mode === "forgot" ? `Remembered it? <a class="l" data-lg="login">Log in</a>` : `Already have an account? <a class="l" data-lg="login">Log in</a>`;
  el.innerHTML = `${PITCH}<div class="side"><form novalidate><div class="brand mbrand"><div class="logo">⚡</div>AutoApply</div><h1>${AUTH.step === "password" && AUTH.name ? `Welcome back, ${esc(AUTH.name.split(" ")[0])}` : T[0]}</h1><p class="lead">${esc(T[1])}</p>${body}
    ${err("form")}<div class="alt">${foot}</div><div class="fine">Your data is private to your account.</div></form></div>`;

  // ---- helpers: errors appear under the field they are about, and stay until the person fixes them ----
  const setErr = (id, msg) => { const box = $(`#err-${id}`) ?? $("#err-form"); if (box) { box.textContent = msg; box.classList.add("on"); } const inp = { email: "#lgEmail", pw: "#lgPw", name: "#lgName" }[id]; if (inp && $(inp)) { $(inp).classList.add("bad"); $(inp).focus(); } };
  const clearErr = () => { el.querySelectorAll(".ferr").forEach((b) => { b.textContent = ""; b.classList.remove("on"); }); el.querySelectorAll(".bad").forEach((i) => i.classList.remove("bad")); };
  const placeErr = (e) => { const m = e.message ?? String(e); setErr(/password/i.test(m) ? "pw" : /email|account for/i.test(m) ? "email" : /name/i.test(m) ? "name" : "form", m); };
  const paintRules = () => { const p = $("#lgPw")?.value ?? ""; $("#pwRules")?.querySelectorAll("li").forEach((li) => li.classList.toggle("ok", PW_RULES.find(([id]) => id === li.dataset.rule)[2](p))); };
  $("#lgPw")?.addEventListener("input", () => { paintRules(); if ($("#pwRules") && !pwMissing($("#lgPw").value).length) { $("#err-pw").textContent = ""; $("#lgPw").classList.remove("bad"); } });
  paintRules();
  $("#lgEye")?.addEventListener("click", () => { const i = $("#lgPw"); i.type = i.type === "password" ? "text" : "password"; $("#lgEye").textContent = i.type === "password" ? "👁" : "🙈"; i.focus(); });
  el.querySelectorAll("[data-lg]").forEach((x) => x.onclick = () => { AUTH = { mode: x.dataset.lg, step: "email", email: $("#lgEmail")?.value.trim() || AUTH.email, name: "" }; if (x.dataset.lg === "forgot") history.replaceState(null, "", location.pathname); showLogin(); });
  el.querySelector("[data-lg-back]")?.addEventListener("click", () => { AUTH = { ...AUTH, step: "email", notice: "" }; showLogin(); });
  $("#lgGoogle")?.addEventListener("click", () => { location.href = `${sb.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(location.href.split("#")[0])}`; });

  el.querySelector("form").onsubmit = async (ev) => {
    ev.preventDefault();
    clearErr();
    const btn = el.querySelector("button[type=submit]"); if (!btn) return;
    const email = ($("#lgEmail")?.value ?? AUTH.email).trim(), pw = $("#lgPw")?.value ?? "", name = $("#lgName")?.value.trim() ?? "";
    // check everything here first, and say exactly what is wrong
    if ($("#lgName") && !name) return setErr("name", "Enter your name.");
    if ($("#lgEmail") && !email) return setErr("email", "Enter your email address.");
    if ($("#lgEmail") && !EMAIL_RE.test(email)) return setErr("email", "That doesn't look like an email address. It should be like name@example.com.");
    if ($("#pwRules")) { const miss = pwMissing(pw); if (miss.length) return setErr("pw", `Your password still needs ${miss.length > 1 ? `${miss.slice(0, -1).join(", ")} and ${miss.at(-1)}` : miss[0]}.`); }
    else if ($("#lgPw") && !pw) return setErr("pw", "Enter your password.");
    btn.disabled = true; const label = btn.textContent; btn.textContent = "One moment…";
    try {
      if ($("#lgEmail")) AUTH.email = email;
      if (AUTH.mode === "reset") {
        const r = await api("/auth/reset-finish", { method: "POST", body: AUTH.accessToken ? { accessToken: AUTH.accessToken, password: pw } : { token: AUTH.token, password: pw } });
        history.replaceState(null, "", location.pathname); AUTH = { mode: "login", step: "email", email: "", name: "" };
        toast("Password changed. You're logged in."); return signedIn(r);
      }
      if (offlineLogin) { await sbAuth("password", { email, password: pw }); return await goOffline(); }
      if (AUTH.mode === "forgot") {
        const r = await api("/auth/reset", { method: "POST", body: { email, redirectTo: location.origin + location.pathname } });
        AUTH = { ...AUTH, step: "sent", emailed: !!r.emailed }; return showLogin();
      }
      if (AUTH.step === "email" && AUTH.mode !== "setup") {
        const r = await api("/auth/lookup", { method: "POST", body: { email } });
        if (r.next === "password") { AUTH = { ...AUTH, mode: "login", step: "password", name: r.name ?? "", notice: "" }; await showLogin(); if (name || pw) $("#err-pw") && setErr("pw", "You already have an account with this email. Enter your password to log in."); return; }
        if (r.next === "closed") { AUTH = { ...AUTH, step: "closed" }; return showLogin(); }
        if (AUTH.mode === "login") { AUTH = { ...AUTH, mode: "signup", step: "details", name: r.name ?? "", invited: r.invited, notice: r.invited ? "You've been invited. Choose a password to finish." : "There's no account for this email yet. Create one below." }; return showLogin(); }
      }
      const route = AUTH.step === "password" ? "login" : AUTH.mode === "setup" ? "setup" : "register";
      const r = await api(`/auth/${route}`, { method: "POST", body: { email: AUTH.email, password: pw, name } });
      if (HOSTED && SB.cfg && r.token) setTimeout(() => sbAuth("password", { email: AUTH.email, password: pw }).catch(() => {}), 4000);
      AUTH = { mode: "login", step: "email", email: "", name: "" };
      signedIn(r);
    } catch (e) { placeErr(e); }
    finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
  };
  ($("#lgName") ?? $("#lgEmail") ?? $("#lgPw"))?.focus();
}
// A reset link (?reset=…) or a reset email (#…type=recovery) opens "Choose a new password", signed in or not.
async function resetFromUrl() {
  const token = new URLSearchParams(location.search).get("reset"), h = new URLSearchParams(location.hash.slice(1));
  if (!token && !(h.get("type") === "recovery" && h.get("access_token"))) return false;
  AUTH = { mode: "reset", step: "email", email: "", name: "", token, accessToken: token ? null : h.get("access_token") };
  if (token) { try { const r = await api("/auth/reset-info", { method: "POST", body: { token } }); AUTH.email = r.email; } catch (e) { AUTH.resetError = e.message; } }
  await showLogin();
  return true;
}
function signedIn(r) {
  if (r.token) store.set("aa.token", r.token);
  $("#login")?.remove(); boot();
}
function showPending() {
  if ($("#login")) return;
  const el = document.createElement("div"); el.className = "auth"; el.id = "login";
  el.innerHTML = `${PITCH}<div class="side"><form><h1>Almost there</h1><p class="lead">Your account is waiting for approval by the person who runs AutoApply. You can use it as soon as they approve it.</p>
    <button type="button" class="btn primary go" onclick="location.reload()">Check again</button><div class="alt"><a class="l" id="pendOut">Log out</a></div></form></div>`;
  document.body.append(el);
  $("#pendOut").onclick = async () => { await api("/auth/logout", { method: "POST", body: {} }).catch(() => {}); store.set("aa.token", ""); location.reload(); };
}

async function boot() {
  if (HOSTED) {
    const cfg = await fetch("config.json", { cache: "no-store" }).then((r) => r.json()).catch(() => ({}));
    API = (cfg.apiBase ?? "").replace(/\/$/, "");
    SB.cfg = cfg.supabase?.url && cfg.supabase?.anonKey ? { url: cfg.supabase.url.replace(/\/$/, ""), anonKey: cfg.supabase.anonKey } : null;
    // the running AutoApply (this PC or the cloud server) publishes its current address to Supabase on each start
    if (SB.cfg) {
      const live = await fetch(`${SB.cfg.url}/storage/v1/object/public/autoapply-public/site.json?t=${Date.now()}`, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
      if (live?.apiBase) API = live.apiBase.replace(/\/$/, "");
    }
    const up = API && await fetch(`${API}/api/auth/state`, { headers: authHeader(), signal: AbortSignal.timeout(10000) }).then((r) => r.status < 500).catch(() => false);
    const h = new URLSearchParams(location.hash.slice(1));
    if (SB.cfg && h.get("access_token") && h.get("refresh_token")) { sbStore({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: h.get("expires_in") }); if (!up) history.replaceState(null, "", location.pathname + location.search); }
    if (!up) return SB.cfg && sbSession() ? goOffline().catch((e) => { fail(e); showLogin(); }) : showLogin();
  }
  if (await resetFromUrl()) return;
  // back from "Continue with Google" (Supabase puts the token after #)
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("access_token")) {
    history.replaceState(null, "", location.pathname + location.search);
    try { const r = await api("/auth/oauth", { method: "POST", body: { accessToken: hash.get("access_token") } }); if (r.token) store.set("aa.token", r.token); } catch (e) { fail(e); }
  }
  const st = await api("/auth/state");
  if (!st.account) return showLogin(st.needsSetup ? "setup" : undefined);
  if (st.account.status === "pending") return showPending();
  S.me = st.account; S.offlineAvail = !!st.supabase;
  await loadUsers(); await render(); pollTasks();
  ensureOfflineSignIn();
}
boot().catch((e) => { if (!$("#login")) $("#main").innerHTML = `<div class="card">Could not load: ${esc(e.message)}</div>`; });
</script>
