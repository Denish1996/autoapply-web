VIEWS.questions = async (v) => {
  const un = await api(`${U()}/inbox`);
  const learned = await api(`${U()}/learned`);
  const bank = S.user.answers;
  v.addEventListener("click", async (e) => {
    const sv = e.target.closest("[data-lsave]"), dl = e.target.closest("[data-ldel]");
    if (!sv && !dl) return;
    const i = Number((sv ?? dl).dataset.lsave ?? (sv ?? dl).dataset.ldel);
    try {
      await api(`${U()}/learned`, { method: "PUT", body: dl ? { key: learned[i].key, remove: true } : { key: learned[i].key, answer: v.querySelector(`[data-l="${i}"]`).value } });
      toast(dl ? "Forgotten" : "Answer updated"); render();
    } catch (err) { fail(err); }
  });
  const KIND = { question: "❓", verify: "✉️", captcha: "🧩", mfa: "🔐", account: "👤", review: "👀" };
  const jobsLine = (q) => q.jobs?.length ? `${q.jobs.length} job${q.jobs.length > 1 ? "s" : ""} waiting: ${q.jobs.slice(0, 3).map((j) => esc(`${j.company} — ${j.title}`)).join(", ")}${q.jobs.length > 3 ? "…" : ""}` : `Asked by: ${(q.seenAt ?? []).map(esc).join(", ")}`;
  const answerUi = (q, i) => {
    if (q.kind !== "question") return `<div class="row"><button class="btn sm primary" data-done="${i}">Done${q.jobs?.length ? " — retry" : ""}</button><button class="btn sm ghost" data-dismiss="${i}">Dismiss</button></div>`;
    if (q.options?.length && q.options.length <= 6) return `<div class="row" style="gap:6px">${q.options.map((o) => `<button class="btn sm" data-tap="${i}" data-val="${esc(o)}">${esc(o)}</button>`).join("")}<button class="btn sm ghost" data-dismiss="${i}">Skip</button></div>`;
    const input = q.options?.length ? `<select data-q="${i}"><option value="">Choose…</option>${q.options.map((o) => `<option>${esc(o)}</option>`).join("")}</select>` : `<textarea data-q="${i}" style="min-height:60px" placeholder="Your answer"></textarea>`;
    return `${input}<div class="row" style="margin-top:10px"><button class="btn sm primary" data-save="${i}">Save${q.jobs?.length ? " & retry" : ""}</button><button class="btn sm ghost" data-dismiss="${i}">Skip</button></div>`;
  };
  v.innerHTML = `<h1>Needs you</h1><p class="sub">Only what AutoApply can't do on its own: new questions, verification codes when no mailbox is connected, and CAPTCHAs. Runs never stop for these — the jobs wait here. Answer once: it's saved to the profile, never asked again, and the waiting jobs are retried right away.</p>
    ${un.length ? un.map((q, i) => `<div class="card"><div class="row" style="align-items:flex-start"><div style="font-size:20px">${KIND[q.kind] ?? "❓"}</div><div style="flex:1"><b>${esc(q.question)}</b>
      <div class="muted" style="margin:4px 0 10px;font-size:12.5px">${jobsLine(q)}</div>${answerUi(q, i)}</div></div></div>`).join("")
      : `<div class="card empty"><div class="big">🎉</div><p>Nothing needs you right now.</p></div>`}
    <div class="card"><div class="row"><h2 style="flex:1">Answers remembered from past applications (${learned.length})</h2>
      ${learned.length ? `<a class="btn sm" href="/api${U()}/learned?format=csv">⬇ Download (opens in Excel)</a>` : ""}</div>
      <p class="muted" style="margin:4px 0 12px">The first time Claude answers a question it's saved here. After that the same question is answered from this list instantly, without asking Claude. Company-specific questions ("Why do you want to work here?") are always written fresh. Edit any answer to change what's given next time.</p>
      ${learned.length ? `<div id="learned">${learned.map((e, i) => `<div class="kv" style="grid-template-columns:1fr 1.2fr auto auto"><div><b style="font-weight:550">${esc(e.question)}</b><div class="muted" style="font-size:12px">${e.source === "you" ? "edited by you" : e.source === "judgment" ? "best judgment" : "Claude"} · ${esc(e.from ?? "")}${e.uses ? ` · reused ${e.uses}×` : ""}</div></div>
        ${e.options?.length ? `<select data-l="${i}">${e.options.map((o) => `<option ${o === e.answer ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>` : `<textarea data-l="${i}" style="min-height:40px">${esc(Array.isArray(e.answer) ? e.answer[0] : e.answer)}</textarea>`}
        <button class="btn sm" data-lsave="${i}">Save</button><button class="btn sm ghost danger" data-ldel="${i}" title="Forget">✕</button></div>`).join("")}</div>`
      : `<div class="muted" style="font-size:13px">Nothing yet — answers appear here after the first applications.</div>`}
    </div>
    <div class="card"><h2>Your own answers</h2><p class="muted" style="margin:0 0 12px">A phrase from the question → the answer to give. These always win. The longest matching phrase wins.</p>
    <div id="bank">${Object.entries(bank).map(([k, a]) => `<div class="kv"><input value="${esc(k)}"><input value="${esc(a ?? "")}"><button class="btn sm ghost danger" data-rm>✕</button></div>`).join("")}</div>
    <div class="row"><button class="btn sm" id="addKv">＋ Add</button><span class="spacer"></span><button class="btn primary" id="bankSave">Save answers</button></div></div>`;
  const send = async (i, answer, retry = true) => {
    try {
      const r = await api(`${U()}/inbox`, { method: "POST", body: { key: un[i].key, answer, retry } });
      const n = r.requeued.length;
      toast(n ? (r.task ? `Saved — retrying ${n} job${n > 1 ? "s" : ""} now` : `Saved — ${n} job${n > 1 ? "s" : ""} ready to retry`) : "Saved");
      if (r.task) pollTasks(true);
      await loadUsers(); render();
    } catch (e) { fail(e); }
  };
  v.querySelectorAll("[data-save]").forEach((b) => b.onclick = () => { const val = v.querySelector(`[data-q="${b.dataset.save}"]`).value.trim(); if (!val) return toast("Type or pick an answer", true); send(Number(b.dataset.save), val); });
  v.querySelectorAll("[data-tap]").forEach((b) => b.onclick = () => send(Number(b.dataset.tap), b.dataset.val));
  v.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => send(Number(b.dataset.done), null));
  v.querySelectorAll("[data-dismiss]").forEach((b) => b.onclick = () => send(Number(b.dataset.dismiss), null, false));
  v.addEventListener("click", (e) => { if (e.target.matches("[data-rm]")) e.target.closest(".kv").remove(); });
  $("#addKv").onclick = () => $("#bank").insertAdjacentHTML("beforeend", `<div class="kv"><input placeholder="question phrase"><input placeholder="answer"><button class="btn sm ghost danger" data-rm>✕</button></div>`);
  $("#bankSave").onclick = async () => {
    const out = {};
    $("#bank").querySelectorAll(".kv").forEach((r) => { const [k, a] = r.querySelectorAll("input"); if (k.value.trim()) out[k.value.trim().toLowerCase()] = a.value.trim() || null; });
    S.user = await api(`${U()}/answers`, { method: "PUT", body: out }); render(); toast("Answers saved");
  };
};

      <div style="text-align:right;margin-top:8px;font-size:13px"><a class="l" id="lgForgot">Forgot password?</a></div>
      <button class="btn primary go" type="submit">Log in</button>`;
  else if (AUTH.step === "closed") body = `${who}<div class="banner" style="margin-top:14px"><div>🔒</div><div>There's no account for this email, and new sign-ups are by invitation only. Ask the person who runs AutoApply to invite you.</div></div>`;
  else body = `${AUTH.step === "email" ? google : who}
      <label class="f"><span>Full name</span><input id="lgName" autocomplete="name" value="${esc(AUTH.name)}" required></label>
      ${AUTH.step === "email" ? `<label class="f"><span>Email address</span><input id="lgEmail" type="email" autocomplete="username" placeholder="you@example.com" value="${esc(AUTH.email)}" required></label>` : ""}
      <label class="f"><span>Password</span><input id="lgPw" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
      <button class="btn primary go" type="submit">${AUTH.mode === "setup" ? "Create owner account" : "Create account"}</button>
      ${AUTH.mode === "signup" && st.signups === "approval" && !AUTH.invited ? `<div class="fine">New accounts are approved by the person who runs AutoApply before they can apply.</div>` : ""}`;
  const foot = st.offline || AUTH.mode === "setup" ? "" : AUTH.mode === "login" ? `Don't have an account? <a class="l" data-lg="signup">Sign up</a>` : `Already have an account? <a class="l" data-lg="login">Log in</a>`;
  el.innerHTML = `${PITCH}<div class="side"><form novalidate><div class="brand mbrand"><div class="logo">⚡</div>AutoApply</div><h1>${AUTH.step === "password" && AUTH.name ? `Welcome back, ${esc(AUTH.name.split(" ")[0])}` : T[0]}</h1><p class="lead">${T[1]}</p>${body}
    <div class="alt">${foot}</div><div class="fine">${offlineLogin ? "Showing the copy saved while the computer was on." : "Your data stays on the AutoApply owner's computer."}</div></form></div>`;
  el.querySelectorAll("[data-lg]").forEach((x) => x.onclick = () => { AUTH = { mode: x.dataset.lg, step: "email", email: $("#lgEmail")?.value.trim() || AUTH.email, name: "" }; showLogin(); });
  el.querySelector("[data-lg-back]")?.addEventListener("click", () => { AUTH = { ...AUTH, step: "email" }; showLogin(); });
  $("#lgGoogle")?.addEventListener("click", () => { location.href = `${sb.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(location.href.split("#")[0])}`; });
  $("#lgForgot")?.addEventListener("click", async () => {
    try { await api("/auth/reset", { method: "POST", body: { email: AUTH.email, redirectTo: location.href.split("#")[0] } }); toast("Check your email for a password reset link."); } catch (e) { fail(e); }
  });
  el.querySelector("form").onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = el.querySelector(".go"); if (btn) btn.disabled = true;
    if (offlineLogin) {
      try { AUTH.email = $("#lgEmail").value.trim(); await sbAuth("password", { email: AUTH.email, password: $("#lgPw").value }); await goOffline(); }
      catch (err) { fail(err); } finally { if (btn) btn.disabled = false; }
      return;
    }
    try {
      if (AUTH.step === "email") AUTH.email = $("#lgEmail").value.trim();
      if (AUTH.step === "email" && AUTH.mode !== "setup") {
        const r = await api("/auth/lookup", { method: "POST", body: { email: AUTH.email } });
        if (r.next === "password") { if (AUTH.mode === "signup") toast("You already have an account — log in."); AUTH = { ...AUTH, mode: "login", step: "password", name: r.name ?? "" }; return showLogin(); }
        if (r.next === "closed") { AUTH = { ...AUTH, step: "closed" }; return showLogin(); }
        if (AUTH.mode === "login") { AUTH = { ...AUTH, mode: "signup", step: "details", name: r.name ?? "", invited: r.invited }; toast(r.invited ? "You've been invited — choose a password to finish." : "No account for this email yet — create one."); return showLogin(); }
      }
      const route = AUTH.step === "password" ? "login" : AUTH.mode === "setup" ? "setup" : "register";
      const pw = $("#lgPw").value;
      const r = await api(`/auth/${route}`, { method: "POST", body: { email: AUTH.email, password: pw, name: $("#lgName")?.value.trim() } });
      if (HOSTED && SB.cfg && r.token) setTimeout(() => sbAuth("password", { email: AUTH.email, password: pw }).catch(() => {}), 4000);
      signedIn(r);
    } catch (err) { fail(err); } finally { if (btn) btn.disabled = false; }
  };
  ($("#lgName") ?? $("#lgEmail") ?? $("#lgPw"))?.focus();
}
function signedIn(r) {
  if (r.confirmEmail) return toast("Check your email to confirm your account, then log in.");
  if (r.token) store.set("aa.token", r.token);
  $("#login")?.remove(); boot();
}

function showPending() {
  if ($("#login")) return;
  const el = document.createElement("div"); el.className = "auth"; el.id = "login";
  el.innerHTML = `${PITCH}<div class="side"><form><h1>Almost there</h1><p class="lead">Your account is waiting for approval by the person who runs AutoApply. You can use it as soon as they approve it.</p>
    <button type="button" class="btn primary go" onclick="location.reload()">Check again</button><div class="alt"><a class="l" id="pendOut">Log out</a></div></form></div>`;
  document.body.append(el);
  $("#pendOut").onclick = async () => { await api("/auth/logout", { method: "POST", body: {} }).catch(() => {}); store.set("aa.token", ""); location.reload(); };
}

async function boot() {
  if (HOSTED) {
    const cfg = await fetch("config.json", { cache: "no-store" }).then((r) => r.json()).catch(() => ({}));
    API = (cfg.apiBase ?? "").replace(/\/$/, "");
    SB.cfg = cfg.supabase?.url && cfg.supabase?.anonKey ? { url: cfg.supabase.url.replace(/\/$/, ""), anonKey: cfg.supabase.anonKey } : null;
    const up = API && await fetch(`${API}/api/auth/state`, { headers: authHeader(), signal: AbortSignal.timeout(10000) }).then((r) => r.status < 500).catch(() => false);
    if (!up) return SB.cfg && sbSession() ? goOffline().catch((e) => { fail(e); showLogin(); }) : showLogin();
  }
  // back from "Continue with Google" (Supabase puts the token after #)
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("access_token")) {
    history.replaceState(null, "", location.pathname + location.search);
    try { const r = await api("/auth/oauth", { method: "POST", body: { accessToken: hash.get("access_token") } }); if (r.token) store.set("aa.token", r.token); } catch (e) { fail(e); }
  }
  const st = await api("/auth/state");
  if (!st.account) return showLogin(st.needsSetup ? "setup" : undefined);
  if (st.account.status === "pending") return showPending();
  S.me = st.account; S.offlineAvail = !!st.supabase;
  await loadUsers(); await render(); pollTasks();
}
boot().catch((e) => { if (!$("#login")) $("#main").innerHTML = `<div class="card">Could not load: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
